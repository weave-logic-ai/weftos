[package]
name = "weftos-cog-manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "weft-cog-manager (COG-009): the WeftOS appliance console — shows the OS and its cogs (running + marketplace), drives the cog-host lifecycle, with a place for apps. egui, native + wasm."

[lib]
name = "weftos_cog_manager"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "weft-cog-manager"
path = "src/main.rs"

[dependencies]
ehttp = "0.5"
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
web-time = "1.1"
# Catalog types + merge; both wasm-safe (cog-repo lib has no cli feature here).
weftos-cog-market = { path = "../weftos-cog-market", features = ["guides"] }
weftos-cog-repo = { path = "../weftos-cog-repo", default-features = false }
# ADR-104 guide renderer (GuideBundle::from_json + GuideView), reused for the Sensors tab. wasm-safe.
weftos-sensor-guide = { path = "../weftos-sensor-guide" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Location"] }
console_error_panic_hook = "0.1"
