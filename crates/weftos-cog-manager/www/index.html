<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WeftOS console</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1b1b1b; overflow: hidden; }
    #mgr_canvas { width: 100%; height: 100%; display: block; }
    #loading { position: absolute; inset: 0; display: grid; place-items: center; color: #aaa;
               font: 14px system-ui, sans-serif; }
  </style>
</head>
<body>
  <canvas id="mgr_canvas"></canvas>
  <div id="loading">Loading the WeftOS console… (add <code>?host=http://&lt;ip&gt;:9480</code> to pick the cog-host)</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
