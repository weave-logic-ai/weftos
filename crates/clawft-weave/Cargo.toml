[package]
name = "clawft-weave"
version.workspace = true
# rationale: operator binary (`weaver`); shipped via cargo-dist, not crates.io.
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "WeftOS operator CLI (weaver) — kernel management, services, and agent orchestration"
keywords = ["cli", "kernel", "os", "agent", "operator"]
categories = ["command-line-utilities"]

[lib]
name = "clawft_weave"
path = "src/lib.rs"

[[bin]]
name = "weaver"
path = "src/main.rs"

[package.metadata.dist]
dist = true

[features]
# WEFT-497: removed empty `agent-core-chat` cutover flag after D3 soak.
# `agent.chat` always dispatches via `clawft-service-agent::AgentService`.
default = ["cluster", "ecc", "exochain", "mesh", "placement"]
cluster = ["clawft-kernel/cluster"]
ecc = ["clawft-kernel/ecc", "dep:blake3"]
exochain = ["clawft-kernel/exochain", "dep:exo-resource-tree", "dep:rvf-types"]
# P3-S: `weaver mesh ...` (serve + admin verbs) links the machine mesh service crate.
mesh = ["clawft-kernel/mesh", "clawft-kernel/quic", "dep:clawft-mesh-service", "dep:clawft-mesh-local"]
# mesh-placement-12: placement control plane (runtime adapters + mesh).
placement = ["clawft-kernel/workload-runtime", "mesh", "ecc", "exochain"]
rvf-rpc = ["dep:weftos-rvf-wire", "dep:rvf-types"]

[dependencies]
clawft-core = { workspace = true, features = ["native", "rvf", "embedding-router"] }
eml-core = { workspace = true }
# http-client: real reqwest-backed URL ingest (WEFT-368).
# mcp: WEFT-369 graphify MCP server (query/ingest/export/diff over stdio).
clawft-graphify = { workspace = true, default-features = false, features = ["http-client", "mcp"] }
clawft-kernel = { workspace = true, features = ["native"] }
clawft-mesh-service = { workspace = true, optional = true }
clawft-mesh-local = { workspace = true, optional = true }
clawft-platform = { workspace = true }
clawft-rpc = { workspace = true }
clawft-types = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
weftos-leaf-types = { path = "../weftos-leaf-types", features = ["std"] }
# WEFT-720 / ADR-056 Phase E: BVH spatial CLI + E2E scaffold.
clawft-bvh = { path = "../clawft-bvh" }
hex = "0.4"
# Phase E: vector scene producer pipeline.
#
# `weftos-leaf-scene` (Phase A) supplies the wire types (`SceneEnvelope`,
# `SceneOp`, `Scene`, codec). `weftos-scene-builder` (this phase) wraps
# them in a fluent producer API + diff/snapshot helpers.
#
# Both are out-of-workspace crates with their own `[workspace]` tables;
# path deps land them in clawft-weave's build graph regardless. The
# leaf-scene `std` feature is required so its serde derive lights up
# host-side allocators.
weftos-leaf-scene = { path = "../weftos-leaf-scene", features = ["std"] }
weftos-scene-builder = { path = "../weftos-scene-builder" }
anyhow = { workspace = true }
async-trait = { workspace = true }
comfy-table = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
tempfile = { workspace = true }
blake3 = { workspace = true, optional = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
dashmap = { workspace = true }
clawft-service-whisper = { workspace = true }
clawft-service-llm = { workspace = true }
clawft-service-terminal = { workspace = true }
clawft-service-classify = { workspace = true }
clawft-service-agent = { workspace = true }
# WEFT-494: live McpServerManager registry behind mcp.add/list/remove/reload.
clawft-services = { workspace = true }
# M4 Phase C.1: `subagent` enables the four spawn tools (agent_spawn /
# task_status / task_result / agent_message) in register_all — the daemon is
# the only caller that injects a live SubagentSpawner. Workspace pins
# default-features = false, so the feature must be named explicitly here.
# WEFT-349: `delegate` so the chat daemon can register `delegate_task`
# with specialist profiles + local subagent spawner.
clawft-tools = { workspace = true, features = ["native", "subagent", "delegate"] }
# Base64 encoding for terminal RPC payloads (PTY bytes don't survive
# raw JSON; chunks ride as { data: <base64>, ... }).
base64 = "0.22"
# `.env` loader. The daemon reads OPENROUTER_API_KEY (and friends) from
# the environment; loading `.env` from cwd at startup makes the
# OpenRouter takeover work without forcing the user to export keys
# in their shell rc.
dotenvy = "0.15"
exo-resource-tree = { workspace = true, optional = true }
weftos-rvf-wire = { workspace = true, optional = true }
rvf-types = { workspace = true, optional = true }
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["signal", "process", "fs", "user"] }
