[package]
name = "weftos-ecg-scope"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "egui scope for the sen0213-ecg cog: live ECG graph, hook-up checklist and calibration tools (native + wasm)"

[lib]
name = "weftos_ecg_scope"
path = "src/lib.rs"
# cdylib for the wasm web build, rlib for the native binary.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "weft-ecg-scope"
path = "src/main.rs"

[dependencies]
egui_plot = "0.35"
serde_json = { workspace = true }
web-time = "1.1"
weftos-cog-companion = { path = "../weftos-cog-companion" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
