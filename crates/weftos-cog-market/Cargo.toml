[package]
name = "weftos-cog-market"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Unified cog marketplace catalog (COG-009): merges the WeaveLogic signed registry (COG-008) with a read-only mirror of Cognitum's app-registry.json. Pure parse/merge — no network — so it builds for native and wasm."

[features]
# The sensor hook-up guides (~0.2 MB) ship only with the console; the host, licence and sources
# crates depend on this crate without them.
guides = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Lib only: the WeaveLogic Registry types + Ed25519 verify, without the native CLI deps (reqwest/pkcs8),
# so this crate (and the egui/WASM manager that uses it) compiles for wasm32.
weftos-cog-repo = { path = "../weftos-cog-repo", default-features = false }

[dev-dependencies]
# always test the bundled guides, whatever the other crates in the build ask for
weftos-cog-market = { path = ".", features = ["guides"] }
