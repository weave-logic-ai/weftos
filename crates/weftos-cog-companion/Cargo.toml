[package]
name = "weftos-cog-companion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Shared shell for sensor-cog companion apps (ADR-104): Seed connection, agent API, manifest-driven cog settings, hook-up checklist with guide links, Live/Guide tabs, native + wasm"

[dependencies]
ehttp = "0.5"
serde = { workspace = true }
serde_json = { workspace = true }
web-time = "1.1"
weftos-sensor-guide = { path = "../weftos-sensor-guide" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Location"] }
console_error_panic_hook = "0.1"
