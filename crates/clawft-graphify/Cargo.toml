[package]
name = "clawft-graphify"
version.workspace = true
publish = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Knowledge graph builder for WeftOS: extracts entities and relationships from code (tree-sitter) and documents, clusters and exports them."

[features]
default = ["code-domain", "rdf-ingest"]
ast-extract = ["dep:tree-sitter"]
semantic-extract = []
vision-extract = []
code-domain = []
forensic-domain = []
html-export = ["dep:html-escape"]
neo4j-export = []
kernel-bridge = ["dep:clawft-kernel", "dep:async-trait"]
# Real HTTP for URL ingest (reqwest + rustls). Production binaries
# (weaver) enable this; unit tests keep StubHttpClient / mock clients.
http-client = ["dep:reqwest"]
# OWL/RDF ingest (Turtle, JSON-LD) via Oxigraph stack (WEFT-358 / OG-2).
# Default-on so ontology pipelines work without extra feature flags.
rdf-ingest = ["dep:oxrdfio", "dep:oxrdf"]
# WEFT-369: stdio MCP server + graphify_query/ingest/export/diff tools.
mcp = []
# WEFT-516: make SASE the default cluster() method (still selectable without
# this flag via ClusterMethod::Sase). Label-propagation remains the default
# until parity benchmarks justify enabling this in production.
sase-cluster = []
full = ["ast-extract", "semantic-extract", "vision-extract", "code-domain",
        "forensic-domain", "html-export", "neo4j-export", "kernel-bridge",
        "http-client", "lang-all", "rdf-ingest", "mcp"]
# Note: `sase-cluster` is intentionally NOT in `full` — WEFT-516 keeps
# label-propagation as the production default until parity is re-checked.

lang-python = ["ast-extract", "dep:tree-sitter-python"]
lang-javascript = ["ast-extract", "dep:tree-sitter-javascript"]
lang-typescript = ["ast-extract", "dep:tree-sitter-typescript"]
lang-rust = ["ast-extract", "dep:tree-sitter-rust"]
lang-go = ["ast-extract", "dep:tree-sitter-go"]
lang-java = ["ast-extract", "dep:tree-sitter-java"]
lang-c = ["ast-extract", "dep:tree-sitter-c"]
lang-cpp = ["ast-extract", "dep:tree-sitter-cpp"]
lang-ruby = ["ast-extract", "dep:tree-sitter-ruby"]
lang-csharp = ["ast-extract", "dep:tree-sitter-c-sharp"]
lang-all = ["lang-python", "lang-javascript", "lang-typescript", "lang-rust",
            "lang-go", "lang-java", "lang-c", "lang-cpp", "lang-ruby", "lang-csharp"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
dashmap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
rayon = { workspace = true }
petgraph = { workspace = true }
walkdir = { workspace = true }
eml-core = { workspace = true }
clawft-treecalc = { workspace = true }
serde_yaml = { workspace = true }

# Optional
tree-sitter = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.23", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
html-escape = { version = "0.2", optional = true }
async-trait = { workspace = true, optional = true }
clawft-kernel = { workspace = true, optional = true, features = ["ecc"] }
# Note: `clawft-llm` is intentionally NOT a dep here. The `semantic-extract`
# and `vision-extract` features take an `FnOnce(String) -> Future` callback
# instead of binding the provider, which keeps extraction logic testable
# with fake LLM responses (see `.planning/graphify-rs/phase45-notes.md` §3).
# The previously-declared optional `clawft-llm` dep was dead — no feature
# gated it on, no source `use`d it. Removed in WEFT-383 (ws12 cleanup).
notify = { workspace = true, optional = true }
# WEFT-368: blocking reqwest for sync `HttpClient` trait (ingest is sync).
# rustls-tls matches workspace (musl/static builds); `blocking` because the
# graphify `HttpClient` trait is intentionally non-async.
reqwest = { workspace = true, optional = true, default-features = false, features = ["blocking", "rustls-tls", "json"] }

# WEFT-358 / OG-2: Oxigraph RDF I/O stack (Turtle + JSON-LD parsers).
# Optional behind `rdf-ingest` (enabled by default).
oxrdfio = { version = "0.2.5", optional = true }
oxrdf = { version = "0.3.3", optional = true }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
# Sync mock HTTP server for Reqwest::blocking tests (WEFT-368).
# Prefer mockito over wiremock here: blocking reqwest cannot be used/dropped
# inside a tokio async test context.
mockito = "1"
# WEFT-370 / GRAPH-041: criterion microbenches (extraction + graph_ops).
criterion = { version = "0.5", features = ["html_reports"] }

# WEFT-370: dedicated criterion targets named in MASTER_PLAN GRAPH-041.
[[bench]]
name = "extraction"
harness = false

[[bench]]
name = "graph_ops"
harness = false

# WEFT-381: vision_extract e2e fixture + mock vision path.
# Only builds when `vision-extract` is enabled (CI job + local --features).
[[test]]
name = "vision_extract_e2e"
required-features = ["vision-extract"]
