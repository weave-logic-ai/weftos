[package]
name = "weftos-cog-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "weft-cog-host (COG-009): a WeftOS process supervisor that runs cogs on an appliance with no agent cap, each still ingesting to the Cognitum store. Lifecycle HTTP API for the manager UI. std-only, arm64-portable."

[[bin]]
name = "weft-cog-host"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Install-time verification: Ed25519 (pinned WeaveLogic key) + sha256, reused from the repo lib
# (no `cli` feature → no reqwest/TLS pulled into the appliance host).
weftos-cog-repo = { path = "../weftos-cog-repo", default-features = false }
base64 = "0.22"
# USB id table for /hw/usb (pure data, wasm-safe; no new third-party deps).
weftos-cog-market = { path = "../weftos-cog-market" }

[dev-dependencies]
tempfile = { workspace = true }
