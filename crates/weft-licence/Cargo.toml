[package]
name = "weft-licence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "weft-licence (ADR-106 phase 2): the Seed-side licence proxy. Checks the declared licence, fetches a cog, verifies its hashes and signs a CheckoutGrant for the one WeftOS mesh the Seed is bound to. Its own binary, user and unit; std only, builds for armv7 and aarch64."

[features]
default = ["registry"]
# Registry fetch through weftos-cog-sources' https reader (sha256 + size
# checked, https-to-http redirects refused). Off by default so the core
# stays dependency-light; the Seed build turns it on.
registry = ["dep:weftos-cog-sources", "dep:weftos-cog-market", "dep:chrono"]
# Real https for the registry reader (rustls, pulls ring).
net = ["registry", "weftos-cog-sources/net"]

[lib]
name = "weft_licence"
path = "src/lib.rs"

[[bin]]
name = "weft-licence"
path = "src/main.rs"

[dependencies]
weft-licence-wire = { path = "../weft-licence-wire" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
blake3 = { workspace = true }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
zeroize = { workspace = true }
libc = "0.2"
weftos-cog-sources = { path = "../weftos-cog-sources", optional = true }
weftos-cog-market = { path = "../weftos-cog-market", optional = true }
chrono = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
toml = { workspace = true }
