[package]
name = "clawft-gui-egui"
version.workspace = true
# Not published: include_str! reads clawft-surface fixtures outside the crate.
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "egui/eframe native GUI spike for ClawFT — ports the 12 core UI blocks"

# WEFT-499: first-class cargo-dist release artifact (weft-gui-egui binary).
# Archives land on GitHub Releases as clawft-gui-egui-<triple>.tar.gz
# alongside weft/weaver. Installers: shell + Homebrew formula.
# Project uses tar.gz + shell/homebrew (not .deb/.dmg) for all dist apps.
[package.metadata.dist]
dist = true
display-name = "weft-gui-egui"
# default-features already includes `native` (required by [[bin]] weft-gui-egui).
features = ["native"]

# cargo-dist 0.31 still lists bins that have unmet required-features in the
# package plan; pin the install/archive binary set per target so weft-demo-lab
# never ships (demo-lab feature stays opt-in for local A/B theming).
# Must cover EVERY workspace.metadata.dist target (incl. Windows) or cargo-dist
# falls back to all [[bin]] entries and fails looking for weft-demo-lab.exe.
[package.metadata.dist.binaries]
x86_64-unknown-linux-gnu = ["weft-gui-egui"]
aarch64-unknown-linux-gnu = ["weft-gui-egui"]
x86_64-unknown-linux-musl = ["weft-gui-egui"]
aarch64-unknown-linux-musl = ["weft-gui-egui"]
x86_64-apple-darwin = ["weft-gui-egui"]
aarch64-apple-darwin = ["weft-gui-egui"]
x86_64-pc-windows-msvc = ["weft-gui-egui"]

# wasm-pack settings: enable wasm-opt with `-Oz` (size-optimized)
# for release builds.
#
# History: wasm-pack used to bundle an old binaryen whose `wasm-opt`
# rejected modern Rust's bulk-memory output. wasm-pack ≥ 0.13 picks
# up a system `wasm-opt` instead, and the in-repo build script
# (`extensions/vscode-weft-panel/scripts/build-wasm.sh`) also has a
# post-bindgen `wasm-opt -Oz` pass as a belt-and-braces fallback for
# the cargo+wasm-bindgen path. Either way the published bundle is
# now optimised. WEFT-246.
#
# The size impact matters: cold-load over the VSCode webview's local
# resource loader pays ~3× the size of an uncached wasm bundle (gzip
# parses + caches per-file for resource:// URLs). Without `-Oz` the
# bundle was ~4.2 MB; with it the bundle drops below ~2 MB, putting
# panel boot below 1.5 s on a typical dev box.
[package.metadata.wasm-pack.profile.release]
# Older binaryen versions (≤ 116) refuse modern Rust output unless we
# pass the feature-enable flags rustc 1.93 emits. The build script's
# fallback path uses the same set; keep them in sync.
wasm-opt = [
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-ext",
    "--enable-mutable-globals",
    "--enable-multivalue",
    "--enable-reference-types",
    "-Oz",
]

# ── Native-only bins (excluded from wasm via target.cfg) ─────────────

[[bin]]
name = "weft-gui-egui"
path = "src/main.rs"
required-features = ["native"]

# Theming A/B tool — opt-in via --features demo-lab so cargo-dist release
# archives ship only weft-gui-egui (WEFT-499).
[[bin]]
name = "weft-demo-lab"
path = "src/bin/demo_lab.rs"
required-features = ["native", "demo-lab"]

# Standalone reproduction for the `CanonResponse::from_egui` Windows
# RwLock-reentrancy deadlock (fixed in this commit). Native-only — the
# wasm target excludes eframe's native window loop.
[[example]]
name = "canon_slider_windows_deadlock_repro"
path = "examples/canon_slider_windows_deadlock_repro.rs"
required-features = ["native"]

[lib]
name = "clawft_gui_egui"
path = "src/lib.rs"
# Enables wasm-web builds via `cdylib` while still allowing native rlib.
crate-type = ["cdylib", "rlib"]

# ── Cross-target dependencies ────────────────────────────────────────

[dependencies]
# WEFT-577: default-features off so wasm builds do not pull
# `epaint/default_fonts` (NotoEmoji + emoji-icon ~740 KB). Native
# re-enables fonts via eframe's `default_fonts` feature below.
egui = { version = "0.34", default-features = false }
# `datepicker` enables `egui_extras::DatePickerButton` (canon `Field::Date`).
# Note: egui_extras 0.34's datepicker is built on `jiff::civil::Date`, not
# `chrono::NaiveDate` — the original Plane spec referenced chrono but the
# library moved to jiff. We expose `jiff::civil::Date` through `FieldValue::Date`
# so the surface stays in sync with the underlying widget.
# WEFT-577: do **not** enable `all_loaders`. That feature union pulls
# `http` (ehttp), `svg` (resvg — multi-MB), `gif`, and `webp` into the
# VSCode panel wasm bundle even though production only renders PNG
# boot/chip assets via `bytes://` + the PNG-only `image` pin below.
# Keep `image` (crate loader) + `datepicker` (Field::Date / jiff).
egui_extras = { version = "0.34", features = ["image", "datepicker"] }
# Brought in transitively by `egui_extras/datepicker`; named here as a
# direct dep so canon `FieldValue::Date(jiff::civil::Date)` can be
# spelled in this crate's public surface without a re-export hop.
# Feature surface is intentionally minimal (`std` only here). egui_extras'
# datepicker dep also enables `tz-system` + `js` for the picker widget;
# we do **not** enable jiff default features (tzdb bundle / zoneinfo),
# which would re-inflate the wasm bundle (WEFT-577 audit).
jiff = { version = "0.2.23", default-features = false, features = ["std"] }
egui_plot = "0.35"
# NB: egui_dock 0.19 tracks egui 0.34. (0.14 tracked egui 0.29.)
# ADR-001 row 10 — `ui://dock` is implemented via this crate.
egui_dock = "0.19"
# WEFT-252: markdown rendering for assistant turns in the chat panel.
# `egui_commonmark` 0.23 tracks egui 0.34. Default features are disabled
# (they would pull `load-images` → broader image-decoder set than the
# PNG-only pin we keep above for the WEFT-246 wasm bundle budget) and
# only `pulldown_cmark` is re-enabled — that's the parser the renderer
# needs at runtime. No `fetch` (no network egress from chat bubbles),
# no `svg`, no `embedded_image`, no `macros` (compile-time markdown is
# wrong for runtime LLM output). WEFT-577 re-confirmed: no further
# feature trim available without dropping markdown rendering.
egui_commonmark = { version = "0.23", default-features = false, features = ["pulldown_cmark"] }
log = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
# Drop-in Instant/SystemTime: std on native, performance.now() on wasm.
# Without this, wasm32-unknown-unknown panics ("time not implemented on
# this platform") the moment any UI code hits a clock.
web-time = "1"
# NOTE (WEFT-251): the `image` crate is feature-pinned to PNG only.
#
# Why "png" and nothing else:
#   1. egui_extras's `image` feature brings `image` in as a transitive
#      dep but leaves all format features OFF (default-features=false,
#      no overrides). Feature unification across the workspace
#      doesn't reliably enable PNG on `wasm32-unknown-unknown`, so
#      without this explicit pin the boot logo silently fails to
#      decode in the VSCode webview.
#   2. PNG is the only format the egui shell *actually* renders today
#      (the boot splash, the chip icons, the surface-host placeholder
#      thumbnails are all PNG). Pulling JPEG/WebP/AVIF/etc. in via
#      `image = "default"` adds ~600 KB of dead decoders to the wasm
#      bundle — directly opposed to WEFT-246's size budget.
#
# Updating this list:
#   - Adding a format (e.g. WebP) means a measurable wasm bundle
#     hit. Profile the impact (`scripts/build.sh browser` and
#     check `extensions/vscode-weft-panel/webview/wasm/` size)
#     and update the WEFT-246 size note in the wasm-pack metadata
#     above if you go above the ~2 MB target.
#   - The native build pays roughly the same cost in stripped-bin
#     size; the wasm size dominates because cold-load is webview-
#     local and gzip caching is per-resource, not per-tab.
image = { version = "0.25", default-features = false, features = ["png"] }
# Two consumers in this crate:
#  - PcmChunkViewer's inline waveform mini-plot (decodes the
#    pcm_chunk payload's i16le data field for the Explorer).
#  - terminal::Terminal panel (decodes PTY output chunks pushed
#    from the daemon-side terminal service via substrate).
# Cross-target (native + wasm). Pinned to match the version
# `clawft-service-whisper` already brings in.
base64 = "0.22"

# M1.5-C + M1.5-D/E: substrate state tree + ADR-017 OntologyAdapter
# trait + surface-description composer. Compiles on wasm (adapter trait
# + snapshot types only; the kernel adapter + Substrate::subscribe are
# gated native-only inside the crate).
clawft-substrate = { workspace = true }
# M1.5-A + M1.5-D/E: app manifest + registry (ADR-015).
clawft-app = { workspace = true }
# M1.5-B + M1.5-D/E: surface-description IR + composer (ADR-016).
clawft-surface = { workspace = true }
# WEFT-427: shared canon primitives (re-exported as `crate::canon`).
clawft-canon = { workspace = true }
clawft-types = { workspace = true }
# ── Native-only dependencies ─────────────────────────────────────────

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
# alacritty_terminal provides the VT/ANSI parser + Term grid model.
# We feed PTY bytes (received from the daemon-side
# clawft-service-terminal via substrate) through `vte::ansi::Processor`
# into a `Term<NopListener>`, then walk the grid in egui to paint
# colored cells and glyphs. Native-only: alacritty pulls in
# platform-specific tty + polling crates that don't compile for wasm.
alacritty_terminal = "0.25"
tokio = { workspace = true }
clawft-rpc = { workspace = true }
ehttp = { version = "0.5", features = ["native-async"] }
poll-promise = "0.3"
# Native-only: `weft-demo-lab` A/B theming proof. Kept off the wasm
# dependency graph because egui_demo_lib enables `egui_extras/svg`
# (resvg) which alone dominates VSCode panel cold-load size (WEFT-577).
egui_demo_lib = "0.34"

# ── Wasm-only dependencies (compiled for `wasm32-unknown-unknown`) ──

[target.'cfg(target_arch = "wasm32")'.dependencies]
# WEFT-577: drop `default_fonts` on the panel path. epaint's default pack
# embeds Ubuntu + Hack + NotoEmoji + emoji-icon (~1.4 MB). The webview
# installs Latin-subset TTFs from `assets/fonts/` (~125 KB) in `app.rs`.
# Native keeps full default_fonts for desktop UX.
eframe = { version = "0.34", default-features = false, features = ["glow"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "MessageEvent", "EventTarget", "console", "Document",
    "HtmlCanvasElement", "HtmlElement", "Performance"
] }
console_error_panic_hook = "0.1"
# Minimal async + channels that work in single-threaded wasm.
futures = { version = "0.3", default-features = false, features = ["std"] }
# WEFT-264: pure-Rust VT/ANSI grid for the browser terminal panel.
# `alacritty_terminal` does not compile for wasm32 (tty/polling crates);
# vt100 is no-std-friendly parser + screen model (vte + unicode-width).
vt100 = "0.16"

# ── Dev dependencies (integration tests only) ───────────────────────

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
async-trait = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time", "sync"] }
# WEFT-264: host unit tests for the wasm (vt100) terminal path re-include
# `terminal_vt100.rs` under `cfg(test)` — keep the same crate version as
# the wasm target dependency above.
vt100 = "0.16"
# Track 5 Workshop: TOML→substrate file-watcher example. These crates
# stay in dev-dependencies so the release build of clawft-gui-egui
# doesn't pull them; `cargo run --example workshop-watcher` compiles
# them on demand.
notify = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
clawft-rpc = { workspace = true }
anyhow = { workspace = true }
# workshop-watcher migrated to the Phase 3 node-identity gate: it
# generates an ephemeral ed25519 keypair, calls `node.register`,
# and signs every `substrate.publish` over `node_publish_payload`.
# `clawft-kernel` exposes the canonical payload helpers and the
# node-id derivation used by the example.
ed25519-dalek = { workspace = true }
# `OsRng` for the example's ephemeral keypair generation. The
# workspace pins rand 0.8, which is what `ed25519-dalek` 2.x's
# `SigningKey::generate(&mut OsRng)` expects via the `rand_core`
# feature.
rand = { workspace = true }
# Need `node_registry::{node_register_payload, node_publish_payload,
# node_id_from_pubkey}` for the example. The workspace clawft-kernel
# entry sets `default-features = false`; we restore the kernel's
# default feature set here because individual features
# (e.g. `native` alone) don't compile in isolation. This is a
# dev-dep so the cost only hits `cargo run --example`, not the
# release build of the gui-egui library.
clawft-kernel = { workspace = true, features = [
    "native", "exochain", "cluster", "tilezero", "ecc", "mesh",
] }

# ── Features ─────────────────────────────────────────────────────────

[features]
default = ["native"]
# Keep native bins/tests out of the wasm build.
native = []
# Opt-in theming A/B binary (`weft-demo-lab`). Off by default so cargo-dist
# and `scripts/build.sh native --gui` ship only the production GUI (WEFT-499).
#   cargo run -p clawft-gui-egui --features demo-lab --bin weft-demo-lab
demo-lab = []
# Optional procedural boot sounds (pulls in rodio → cpal → alsa).
audio = ["dep:rodio"]
# WEFT-287: vendored vs upstream egui_demo_lib decision.
#
# Decision: **continue vendoring** `fractal_clock.rs`, `http_app.rs`,
# and `custom3d_glow.rs` from upstream `emilk/egui` into
# `src/bin/demo_lab_vendored/` (currently tracking 0.34).
#
# Why we don't depend on `egui_demo_app`:
#   Those three demos live in `egui_demo_app`, which is a *binary-
#   only* crate in the upstream workspace. There is no published
#   library that re-exports them. Depending on the binary crate would
#   force a renamed `[[bin]]` shim plus the wgpu/glutin trees the
#   crate pulls for its full `cargo run`, which we don't otherwise
#   need. The size and dependency cost outweighs the drift risk for
#   three small files.
#
# Why we don't drop them entirely:
#   `weft-demo-lab` paints upstream demos beside our themed panels so
#   theming changes can be A/B'd against a known control. Dropping
#   the upstream demos collapses that proof.
#
# Maintenance contract: the vendored files are byte-for-byte from
# upstream and re-vendored verbatim when egui bumps; they are never
# edited in-tree. The `#[cfg_attr(feature = "serde", ...)]` lines
# they carry are upstream's optional-persistence gates and the
# `serde` feature below exists *solely* to keep those `cfg_attr` lines
# from generating an `unexpected_cfgs` warning under `-D warnings`.
# The feature is intentionally never enabled — leaving it declared is
# the lowest-friction way to honour the "no edits to vendored files"
# rule.
serde = []
# WEFT-248: opt-in live smoke test against a running daemon + llama-server.
# Spawned binaries and network calls don't run under default CI; this
# feature gates the test so `scripts/build.sh test` stays hermetic.
#
# Enable with:
#   cargo test -p clawft-gui-egui --features live-smoke -- --ignored
live-smoke = []

[dependencies.rodio]
version = "0.19"
optional = true
default-features = false
features = ["symphonia-wav"]
