[package]
name = "weftos-guide-view"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Browser popup that renders one ADR-104 sensor guide with weftos-sensor-guide (wasm)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow"] }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "HtmlCanvasElement", "Window"] }
weftos-sensor-guide = { path = "../weftos-sensor-guide" }
