[package]
name = "clawft-types"
version.workspace = true
publish = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core types for the clawft AI assistant framework"
keywords = ["ai", "assistant", "types", "agent", "llm"]
categories = ["development-tools"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["native"]
native = ["dep:dirs", "dep:ulid"]
browser = ["uuid/js", "dep:getrandom"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
# SC-2 / WEFT-223: SecureAudioBuffer / SecureAudioRing zeroize-on-drop.
zeroize = { workspace = true }
# mesh-placement-02: capability vocabulary file (TOML) and its governance digest.
toml = { workspace = true }
sha2 = { workspace = true }
# Phase 1 package B: project ids are ULIDs. Native only: ulid pulls rand 0.9 ->
# getrandom 0.3, which does not build for wasm32-unknown-unknown without cfg flags.
ulid = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# flock on the manifest dir (project model); same crate the kernel uses.
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
