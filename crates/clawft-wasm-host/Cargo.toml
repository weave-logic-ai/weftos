[package]
name = "clawft-wasm-host"
version.workspace = true
# Publishable: native wasmtime host for loading/executing WASM plugins.
publish = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Native wasmtime host runtime for clawft WASM plugins (sandbox, engine, audit, permissions)"
keywords = ["wasm", "wasmtime", "plugin", "sandbox", "ai"]
categories = ["wasm", "development-tools"]


# The ADR-103 Wasmtime project-kernel binary is feature-gated and not shipped yet
# (signed packaging: board card 3cd118d1). Keep cargo-dist from building it.
[package.metadata.dist]
dist = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
# Host library only — never a cdylib / browser target.
crate-type = ["rlib"]

[features]
default = []
project-kernel = ["dep:wasmtime-wasi", "dep:sha2", "dep:libc", "dep:clawft-types", "dep:ed25519-dalek"]
# Reserved for future optional host surfaces (e.g. WASI component model).
# The crate always includes sandbox + engine + audit + permission_store.

[dependencies]
clawft-plugin = { workspace = true, default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
url = "2"
regex = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
dirs = { workspace = true }
chrono = { workspace = true }
# WEFT-551: keep in lockstep with workspace wasmtime pin (48.0.4+ / MSRV 1.95).
# Host uses cranelift + runtime only (no browser/wasm-bindgen).
wasmtime = { workspace = true }

[dev-dependencies]
wat = "1"
tempfile = { workspace = true }

[[bin]]
name = "weftos-wasm-project-runner"
path = "src/project_kernel/main.rs"
required-features = ["project-kernel"]

[dependencies.wasmtime-wasi]
workspace = true
optional = true

[dependencies.sha2]
workspace = true
optional = true


[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[dependencies.clawft-types]
workspace = true
features = ["native"]
optional = true

[dependencies.ed25519-dalek]
workspace = true
optional = true
