[package]
name = "weftos-sensor-guide"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Sensor guides that ship with sensor cogs (ADR-104): guide.toml + Markdown pages, validated and rendered in egui with painted wiring, header, placement and flow diagrams (native + wasm)"

[dependencies]
egui = { version = "0.34", default-features = false }
egui_commonmark = { version = "0.23", default-features = false, features = ["pulldown_cmark"] }
# Image loader for embedded board/pinout photos (ADR-104: guides may ship photos as data in the
# bundle). png + jpeg only, to bound the wasm weight this adds.
egui_extras = { version = "0.34", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
