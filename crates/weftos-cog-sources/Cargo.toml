[package]
name = "weftos-cog-sources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Multi-source cog repositories for a WeftOS project (ADR-105): per-project and per-user source lists (WeftOS, Cognitum, private), Cognitum licence entitlements, namespaced resolution, verified fetch + install, and the cog catalog with per-cog placement policy. No network in the library unless the `net` feature supplies the HTTP reader."

[features]
default = []
# HTTP(S) reader for registry and binary URLs (blocking reqwest). Tests never use it.
net = ["dep:reqwest"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
hex = "0.4"
sha2 = "0.10"
thiserror = { workspace = true }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
weftos-cog-repo = { path = "../weftos-cog-repo", default-features = false }
weftos-cog-market = { path = "../weftos-cog-market" }
weftos-cog-host = { path = "../weftos-cog-host" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }

[dev-dependencies]
tempfile = { workspace = true }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
