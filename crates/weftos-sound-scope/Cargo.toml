[package]
name = "weftos-sound-scope"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Companion app for the sound-detect cog (KY-038/LM393 sound sensor): live level trace with the threshold, sound/quiet state, event rate, hook-up checklist and wiring (native + wasm)"

[lib]
name = "weftos_sound_scope"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "weft-sound-scope"
path = "src/main.rs"

[dependencies]
egui_plot = "0.35"
serde_json = { workspace = true }
web-time = "1.1"
weftos-cog-companion = { path = "../weftos-cog-companion" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
