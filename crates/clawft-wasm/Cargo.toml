[package]
name = "clawft-wasm"
version.workspace = true
# Publishable: WASM entrypoint library reused by browser / wasi consumers.
publish = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "WASM entrypoint for clawft (browser + wasip2)"
keywords = ["wasm", "wasi", "ai", "agent", "edge"]
categories = ["wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Persistent ADR-103 project supervisor; separate from plugin calls.
project-kernel = ["dep:clawft-kernel", "clawft-types/native", "dep:ed25519-dalek", "dep:sha2", "dep:rand", "dep:chrono", "dep:weftos-rvf-crypto", "dep:weftos-rvf-wire", "dep:rvf-types", "dep:rvf-runtime", "dep:ciborium", "dep:tracing", "dep:thiserror"]
browser = [
    "dep:clawft-core",
    "dep:clawft-llm",
    "dep:clawft-tools",
    "dep:clawft-platform",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "dep:js-sys",
    "dep:console_error_panic_hook",
    "dep:chrono",
    "clawft-core/browser",
    "clawft-llm/browser",
    "clawft-tools/browser",
    "clawft-platform/browser",
]
# WEFT-13 / WEFT-14 / WEFT-392 / WEFT-399: persist BrowserFileSystem,
# BrowserEnvironment, conversation JSONL, config snapshot, and per-group
# CLAWFT.md via Origin Private File System (falls back to memory if OPFS
# unavailable).
browser-opfs = [
    "browser",
    "clawft-platform/browser-opfs",
    "clawft-tools/browser-opfs",
]
# WEFT-398: host-side wasmtime plugin runtime lives in `clawft-wasm-host`.
# This feature is a thin re-export for API compatibility with historical
# `clawft_wasm::{sandbox,engine,audit,permission_store}` paths. Prefer
# depending on `clawft-wasm-host` directly for new host code.
wasm-plugins = ["dep:clawft-wasm-host"]
alloc-talc = ["dep:talc"]
alloc-lol = ["dep:lol_alloc"]
alloc-tracing = []

[dependencies]
clawft-types = { workspace = true, default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }

# Behind browser feature
clawft-core = { workspace = true, default-features = false, optional = true }
clawft-llm = { workspace = true, default-features = false, optional = true }
clawft-tools = { workspace = true, default-features = false, optional = true }
clawft-platform = { workspace = true, default-features = false, optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = ["console"] }
js-sys = { version = "0.3", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
chrono = { workspace = true, optional = true }

# Behind wasm-plugins feature (re-export only; implementation in clawft-wasm-host)
clawft-wasm-host = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dlmalloc = { version = "0.2", features = ["global"] }
talc = { version = "4.4", optional = true }
lol_alloc = { version = "0.4", optional = true }

# WEFT-388 (M5-A) — browser regression suite.
# `wasm-bindgen-test` is wasm32-only by construction. Adding it under
# `[target.'cfg(target_arch = "wasm32")'.dev-dependencies]` lets cargo
# resolve the test target on native (where the file is a no-op via
# `#![cfg(target_arch = "wasm32")]`) without dragging the harness into
# native test runs.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[[bin]]
name = "weftos-project-guest"
path = "src/project_kernel/main.rs"
required-features = ["project-kernel"]

[dependencies.clawft-kernel]
workspace = true
default-features = false
optional = true

[dependencies.ed25519-dalek]
workspace = true
optional = true

[dependencies.sha2]
workspace = true
optional = true

[dependencies.rand]
workspace = true
optional = true

[dependencies.weftos-rvf-crypto]
workspace = true
optional = true

[dependencies.weftos-rvf-wire]
workspace = true
optional = true

[dependencies.rvf-types]
workspace = true
optional = true

[dependencies.ciborium]
workspace = true
optional = true

[dependencies.tracing]
workspace = true
optional = true

[dependencies.thiserror]
workspace = true
optional = true

[dependencies.rvf-runtime]
workspace = true
optional = true
