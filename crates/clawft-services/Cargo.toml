[package]
name = "clawft-services"
version.workspace = true
publish = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Services for clawft (cron, heartbeat, MCP)"
keywords = ["cron", "heartbeat", "scheduling", "service"]
categories = ["asynchronous"]

[features]
default = []
delegate = ["regex"]
rvf = []
test-utils = []
clawhub = []
# WEFT-122: `http-api` on clawft-kernel exposes `http_facade` types for the axum binding.
api = [
    "dep:axum",
    "dep:axum-extra",
    "dep:tower-http",
    "dep:futures-util",
    "dep:clawft-core",
    "dep:clawft-platform",
    "dep:clawft-kernel",
    "dep:clawft-rpc",
    "clawft-kernel/http-api",
]

[dependencies]
clawft-types = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
cron = { workspace = true }
reqwest = { workspace = true }
regex = { workspace = true, optional = true }
dirs = { workspace = true }
axum = { version = "0.8", features = ["ws", "json", "macros"], optional = true }
axum-extra = { version = "0.10", features = ["typed-header"], optional = true }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"], optional = true }
futures-util = { workspace = true, optional = true }
clawft-core = { workspace = true, features = ["native"], optional = true }
clawft-platform = { workspace = true, optional = true }
# WEFT-122: http_facade types + KernelEventLog for SSE poll_events loop.
clawft-kernel = { workspace = true, optional = true, default-features = false, features = ["http-api"] }
# ADR-102 D6: DaemonKernelFacade forwards facade routes to the daemon.
clawft-rpc = { workspace = true, optional = true }
# WEFT-187: clawft.toml / config.json hot-reload for tools.mcp_servers.
notify = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
regex = { workspace = true }
mockito = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# WEFT-300: end-to-end heartbeat tests drive the WS handler with a
# real client over a localhost TCP socket.
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
# WEFT-500: MCP HTTP transport integration tests against a real local
# HTTP server (axum TcpListener + wiremock status/path stubs).
axum = { version = "0.8", features = ["json", "macros", "tokio", "http1"] }
wiremock = "0.6"
