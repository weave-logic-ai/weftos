<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WeftOS ToF scope</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1b1b1b; overflow: hidden; }
    #tof_canvas { width: 100%; height: 100%; display: block; }
    #loading { position: absolute; inset: 0; display: grid; place-items: center; color: #aaa;
               font: 14px system-ui, sans-serif; }
  </style>
</head>
<body>
  <canvas id="tof_canvas"></canvas>
  <div id="loading">Loading weft-tof-scope… (add <code>?seed=&lt;seed-ip&gt;</code> to pick the Seed)</div>
  <script type="module">
    import init, { tof_start } from "./pkg/weftos_tof_scope.js";
    await init();
    await tof_start("tof_canvas");
    document.getElementById("loading").remove();
  </script>
</body>
</html>
