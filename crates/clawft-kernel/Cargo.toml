[package]
name = "clawft-kernel"
version.workspace = true
publish = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "WeftOS kernel: boot sequence, process table, service registry, and health subsystem"
keywords = ["kernel", "os", "process", "service", "health"]
categories = ["development-tools"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["native", "exochain", "cluster", "tilezero", "ecc", "mesh", "quic", "workload-runtime"]
native = [
    "dep:tokio",
    "dep:tokio-util",
    "dep:futures",
    "dep:blake3",
    "clawft-core/native",
    "clawft-platform/native",
    "clawft-types/native",
]
cluster = [
    "dep:ruvector-cluster",
    "dep:ruvector-raft",
    "dep:ruvector-replication",
    "dep:parking_lot",
    "dep:futures",
]
exochain = [
    "dep:exo-resource-tree",
    "dep:weftos-rvf-crypto",
    "dep:weftos-rvf-wire",
    "dep:rvf-types",
    "dep:rvf-runtime",
    "dep:ciborium",
    "dep:ed25519-dalek",
    "dep:rand",
    "dep:blake3",
]
tilezero = [
    "exochain",
    "dep:cognitum-gate-tilezero",
]
mesh = [
    "dep:ed25519-dalek",
    "dep:rand",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:snow",
]
# WEFT-118 / ADR-026: QUIC (quinn) mesh transport. Heavy dep tree
# (rustls/ring); opt-out with `--no-default-features --features mesh`
# without `quic`. Default workspace builds enable both via `default`.
quic = ["mesh", "dep:quinn", "dep:rcgen", "dep:rustls"]
# WEFT-683 / ADR-031: experimental RVF KernelMessage IPC encoding surface.
# Default builds ship JSON only (`MeshIpcEncoding::Json`). Enabling this
# exposes `MeshIpcEncoding::Rvf`; encode/decode currently return
# `UnsupportedEncoding` until Option B (full RVF path) lands. Does **not**
# change the production default.
mesh-rvf = ["mesh"]
ecc = ["clawft-core/vector-memory", "dep:blake3", "dep:clawft-bvh"]
# EXPERIMENTAL (0.6.x): quantum backends — interface only, stubs return NotImplemented.
quantum-pasqal = ["ecc", "dep:reqwest"]
quantum-braket = ["ecc", "dep:reqwest"]
diskann = ["ecc", "dep:ruvector-diskann"]
onnx-embeddings = ["dep:ort", "dep:ndarray", "dep:tokenizers", "dep:half"]
wasm-sandbox = ["dep:wasmtime", "dep:wasmtime-wasi"]
os-patterns = ["exochain"]
treesitter = ["dep:clawft-plugin-treesitter"]
sensor = []
containers = []
# mesh-placement-09: WorkloadRuntime adapters (native process, container
# engines, Cognitum Seed API). reqwest drives the Seed's HTTP API.
workload-runtime = ["native", "ecc", "exochain", "dep:reqwest", "dep:rustls"]
http-api = []

[dependencies]
eml-core = { workspace = true }
clawft-treecalc = { workspace = true }
clawft-core = { workspace = true, default-features = false }
clawft-types = { workspace = true, default-features = false }
clawft-platform = { workspace = true, default-features = false }
clawft-plugin = { workspace = true, default-features = false }
clawft-plugin-treesitter = { workspace = true, features = ["rust", "typescript"], optional = true }
# ADR-057 per-path read ACLs — shared table/types with the ontology substrate.
clawft-substrate = { workspace = true }
# ADR-056 / WEFT-718: BVH spatial index (Phase C SpatialBackend).
clawft-bvh = { workspace = true, optional = true }
dashmap = { workspace = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
ruvector-cluster = { workspace = true, optional = true }
ruvector-raft = { workspace = true, optional = true }
ruvector-replication = { workspace = true, optional = true }
ruvector-diskann = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
exo-resource-tree = { workspace = true, optional = true }
weftos-rvf-crypto = { workspace = true, optional = true }
weftos-rvf-wire = { workspace = true, optional = true }
rvf-types = { workspace = true, optional = true }
rvf-runtime = { workspace = true, optional = true }
ciborium = { workspace = true, optional = true }
cognitum-gate-tilezero = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
# Workspace pins ort with default-features = false; re-list the default set
# (std/ndarray/tracing/download-binaries/tls-native/copy-dylibs/api-24) plus
# `half` for fp16 decoder-ONNX tensors (ADR-059). Members can't re-enable a
# workspace dep's default features, so they are enumerated here.
ort = { workspace = true, optional = true, features = [
    "std",
    "ndarray",
    "tracing",
    "download-binaries",
    "tls-native",
    "copy-dylibs",
    "api-24",
    "half",
] }
ndarray = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
half = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
snow = { workspace = true, optional = true }
quinn = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
sha2 = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }

# WEFT-114: wasm32-unknown-unknown needs a browser RNG backend for uuid v4.
# The kernel default feature set includes `mesh` (native-only transports). The
# CI gate runs `cargo check -p clawft-kernel --target wasm32-unknown-unknown
# --no-default-features` so mesh stays off; uuid still requires `js` (or an
# equivalent RNG feature) on this target. Feature unification lifts `js` into
# the shared uuid graph for this build without enabling mesh.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { workspace = true, features = ["js"] }

[target.'cfg(unix)'.dependencies]
# mesh-placement-09: rlimits / signals for the native workload adapter.
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
clawft-platform = { workspace = true }
clawft-types = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }
wiremock = "0.6"
# Self-signed Seed certificates for the pinned-TLS transport tests.
rcgen = { workspace = true }
# WEFT-366 vector_backend_bench: clustered-gaussian synthetic corpus
# generation (see benches/vector_backend_bench.rs). rand_chacha/rand_distr
# pinned locally, matching the clawft-casestudy-gen-qsr precedent.
rand = { workspace = true }
rand_chacha = "0.3"
rand_distr = "0.4"

[[example]]
name = "cog_adapter_run"
required-features = ["workload-runtime"]

[[example]]
name = "workload_node"
required-features = ["workload-runtime", "mesh"]

[[bench]]
name = "vector_backend_bench"
harness = false
required-features = ["ecc"]

# WEFT-361 / KG-004: RFF vs Lanczos vs EML lambda₂ at 1K/10K/100K.
[[bench]]
name = "spectral_lambda2_bench"
harness = false
required-features = ["ecc"]
