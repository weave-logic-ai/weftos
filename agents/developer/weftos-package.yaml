name: developer
kind: lane
trust_tier: core

capabilities:
  - code_write
  - test_write
  - worktree_isolated

required_project_context:
  - key: gate_workflow_path
    description: path to the CI workflow definition that enumerates the gates
  - key: gate_runner_command
    required: false
    description: project's own gate-runner command, if one exists, to avoid writing a second one
  - key: code_index_command
    required: false
    description: symbol/code-graph query command, if the project has one
  - key: worktree_convention
    required: false
    description: how the project expects isolated worktrees to be created/named

secrets: []

requires:
  - skill: build-lane

dependencies: []

provenance:
  source_registry: user harness (private engagement repo)
  source_url: null
  upstream_license: none (internal harness agent, not open-source)
  upstream_commit: null
  adopted_at: "2026-09-28"
  verdict: adopt
  notes: >
    Ported the harness's builder lane near-verbatim — high generalizability per the
    inventory, nearly identical in shape to a generic build lane already. The
    project-specific MCP tool binding (a code-graph explore tool) and gate-runner script
    path became project-context placeholders.
