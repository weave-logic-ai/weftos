name: domain-expert
kind: template
trust_tier: template

capabilities:
  - corpus_query
  - corpus_curate       # admit/prune/flag entries in the project's own curated store

required_project_context:
  - key: domain_corpus.query_command
    description: command to query the project's curated domain corpus
  - key: domain_corpus.ingest_command
    required: false
    description: command to re-ingest new material into the corpus
  - key: domain_corpus.coverage_command
    required: false
    description: command to check claims-to-evidence coverage after ingestion
  - key: domain_corpus.evidence_layers
    required: false
    description: the project's own trust ordering of corpus layers, if it has more than one
  - key: confidentiality_tiers
    required: false
    description: names of restricted tiers this agent must never quote into a wider answer
  - key: open_items_mechanism
    required: false
    description: where a drafted "the corpus can't answer this" question should be routed

secrets: []

requires:
  - skill: grounded-domain

dependencies: []

provenance:
  source_registry: user harness (private engagement repo)
  source_url: null
  upstream_license: none (internal harness agent, not open-source)
  upstream_commit: null
  adopted_at: "2026-09-28"
  verdict: pattern
  notes: >
    Extracted as a template, not a data port, from the harness's client-domain-expert
    agent. Per the inventory: "the *shape* — grounded, supervised, graded honesty — is
    highly reusable; the content is entirely non-portable by design." No client name,
    org fact, or corpus content traveled. Placeholders here must be filled per project
    from .agents/project-context.md, never hardcoded into this template.
