name: reviewer
kind: lane
trust_tier: core

capabilities:
  - read_only_review

required_project_context:
  - key: merge_simulation_command
    required: false
    description: command that computes what a merge will actually produce (preferred over raw diff)
  - key: code_index_command
    required: false
    description: symbol/code-graph query command, if the project has one

secrets: []

requires:
  - skill: adversarial-review

dependencies: []

provenance:
  source_registry: user harness (private engagement repo)
  source_url: null
  upstream_license: none (internal harness agent, not open-source)
  upstream_commit: null
  adopted_at: "2026-09-28"
  verdict: adopt
  notes: >
    Ported near-verbatim — high generalizability per the inventory. Read-only by tool
    list (no Write/Edit), matching the source's structural enforcement of "cannot edit."
