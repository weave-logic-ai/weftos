name: tester
kind: lane
trust_tier: core

capabilities:
  - test_write
  - test_run
  - worktree_isolated

required_project_context:
  - key: unit_test_command
    description: the project's own test-run script (not a bare direct test-binary invocation)
  - key: gate_workflow_path
    description: path to the CI workflow definition that enumerates the gates
  - key: e2e_suite_writes_live
    description: boolean — whether the project's e2e suite writes to a live/production system (if true, never execute it)

secrets: []

requires:
  - skill: prove-it-bites

dependencies: []

provenance:
  source_registry: user harness (private engagement repo)
  source_url: null
  upstream_license: none (internal harness agent, not open-source)
  upstream_commit: null
  adopted_at: "2026-09-28"
  verdict: adopt
  notes: >
    Ported near-verbatim — high generalizability per the inventory. The "never run
    Playwright" rule generalized to "never run a live-writing e2e suite," gated by a
    project-context flag rather than hardcoding a specific test framework.
