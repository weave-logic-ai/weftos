name: liber
nickname: Liber
kind: specialist
trust_tier: core

capabilities:
  - memory_write         # writes only into the memory store the project declares
  - memory_dedupe
  - memory_sweep          # sweeps an in-repo fallback queue on return

required_project_context:
  - key: memory_store.path
    description: root path/index of the memory store this agent routes into
  - key: memory_store.budget
    required: false
    description: size/token budget for the store, if the harness enforces one
  - key: memory_store.fallback_path
    description: in-repo path lanes stage manifests to when Liber is unreachable
  - key: memory_store.health_check_command
    required: false
    description: command that verifies the store and reports found/filed/delegated/refused counts
  - key: routing_table
    required: false
    description: project-specific overrides to the default decision/document/work delegation table

secrets: []

requires:
  - skill: memory-routing

dependencies: []

provenance:
  source_registry: user harness (private engagement repo)
  source_url: null
  upstream_license: none (internal harness agent, not open-source)
  upstream_commit: null
  adopted_at: "2026-09-28"
  verdict: adopt
  notes: >
    Ported from the harness's liber agent. The routing-table destinations (decisions to
    doc-gardener, work to steward, confidential facts refused) generalize directly. The
    "abscission" and "downward flow" capabilities are explicitly not-yet-built in the
    source and are carried over as documented future work, not implemented here.
