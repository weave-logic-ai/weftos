[workspace]
resolver = "2"
members = [
    "crates/clawft-types",
    "crates/clawft-platform",
    "crates/clawft-core",
    "crates/clawft-llm",
    "crates/clawft-tools",
    "crates/clawft-channels",
    "crates/clawft-services",
    "crates/clawft-cli",
    "crates/clawft-wasm",
    # WEFT-398: native wasmtime host for WASM plugins (sandbox/engine/audit/
    # permission_store). Split out of clawft-wasm so the browser/wasip2
    # entrypoint stays free of host-only deps.
    "crates/clawft-wasm-host",
    "crates/clawft-plugin",
    # Only `clawft-plugin-treesitter` remains a workspace member -- it is
    # consumed by `clawft-kernel` (assessment::extract_symbols) under the
    # kernel's `treesitter` feature. The other eight `clawft-plugin-*`
    # crates were moved to `crates/archive/` per ADR-051; they are
    # excluded from the workspace below.
    "crates/clawft-plugin-treesitter",
    "crates/clawft-security",
    "crates/clawft-kernel",
    "crates/clawft-rpc",
    # ADR-103 Phase 3 (package L): mesh-local/1 protocol, user cert, weft:// addresses,
    # peer identity, client. No clawft-kernel dependency by design.
    "crates/clawft-mesh-local",
    # ADR-103 Phase 3 (package J/S): machine mesh service journal and bindings.
    "crates/clawft-mesh-service",
    "crates/clawft-weave",
    "crates/exo-resource-tree",
    # WEFT-619 / ADR-043: K6 substrate primitives (BLAKE3+HLC) + in-memory
    # DagStore/MMR/SMT (no postgres). In-tree stubs of the exo-core/exo-dag
    # contract — not third-party vendored source.
    "crates/exo-core",
    "crates/exo-dag",
    "crates/weftos",
    "crates/clawft-graphify",
    "crates/clawft-lsp-extract",
    "crates/weftos-leaf-types",
    # WEFT-520: LeWM world-model core traits (no_std). First of the 7-crate batch.
    "crates/weftos-worldmodel-core",
    # WEFT-521: LeWM trait impls (null/stub default; optional candle skeleton).
    "crates/weftos-worldmodel-impls",
    # WEFT-522: LeWM facade — re-exports core traits + default impls (single entrypoint).
    "crates/weftos-worldmodel",
    # WEFT-523: LeWM sensor pipeline + CBOR/Ed25519 wire (mesh.sensor.v1.*).
    "crates/weftos-sensor-pipeline-wire",
    "crates/weftos-sensor-pipeline",
    # WEFT-524 / WEFT-533: WorldModelService binary (3 topologies) + frame attestation host.
    "crates/clawft-worldmodel-service",
    # WEFT-525: cognitive work delegation.
    "crates/clawft-delegation",
    # `weftos-leaf-display` removed from the workspace in Phase E
    # (2026-05-15) — superseded by `weftos-leaf-scene`,
    # `weftos-leaf-renderer`, and `weftos-scene-builder`. The directory
    # is intentionally retained on-disk because the sibling
    # `clawft-edge-pad-idf` firmware (out-of-workspace) still
    # path-depends on it; Phase F's cleanup pass migrates that
    # firmware before deleting the directory tree.
    "crates/eml-core",
    "crates/clawft-app",
    "crates/clawft-gui-egui",
    "crates/weftos-ecg-scope",
    "crates/weftos-sensor-guide",
    "crates/weftos-cog-companion",
    "crates/weftos-tof-scope",
    "crates/weftos-sound-scope",
    "crates/weftos-bridge-send",
    # COG-008: off-device WeaveLogic cog repository tooling (sign/verify/install,
    # signed-only Ed25519 trust model).
    "crates/weftos-cog-repo",
    # COG-009: unified cog marketplace catalog (WeaveLogic signed + Cognitum mirror).
    "crates/weftos-cog-market",
    # ADR-105: per-project multi-source cog repositories (WeftOS / Cognitum / private).
    "crates/weftos-cog-sources",
    # COG-009: on-appliance cog supervisor + lifecycle API (no agent cap).
    "crates/weftos-cog-host",
    # COG-009: the WeftOS appliance console (egui native + wasm) over the cog-host.
    "crates/weftos-cog-manager",
    "crates/clawft-substrate",
    "crates/clawft-surface",
    "crates/clawft-canon",
    "crates/clawft-treecalc",
    "crates/clawft-casestudy-gen-qsr",
    "crates/clawft-service-whisper",
    "crates/clawft-service-llm",
    "crates/clawft-service-terminal",
    "crates/clawft-service-classify",
    "crates/clawft-service-agent",
    # Native WebRTC-AEC full-duplex audio bridge (cpal device I/O + WebRTC
    # APM AEC3). Default features are EMPTY so the workspace build never
    # pulls cpal or the heavy bundled libwebrtc APM (cmake) — the runnable
    # bridge + AEC live behind the `bridge` / `webrtc-aec` features.
    # Consumed by the voicelab harness (~/llm) for full-duplex barge-in.
    "crates/clawft-voice-aec",
    # Talk-Mode bridge: binds the generic clawft-channels voice controller to
    # the concrete local stack (Hermes LocalProvider, WebRTC-AEC, kernel ECC).
    # Keeps clawft-channels free of clawft-llm / clawft-kernel / cpal.
    "crates/clawft-voice-talk",
    # Native-Rust ONNX voice models (ECAPA speaker embedding; parakeet STT and
    # smart-turn to follow). Default features are EMPTY so the workspace build
    # never pulls `ort` — real inference lives behind the `onnx` feature.
    # Implements the clawft-channels SpeakerEmbedder seam without cpal/llm/kernel.
    "crates/clawft-voice-onnx",
    # Native-Rust TTS node-renderers (ADR-062 Phase 4): SNAC-24kHz decode,
    # Orpheus-over-Ollama slow layer, Kokoro fast layer — no Python. Default
    # features are EMPTY so the workspace build never pulls `ort`; real SNAC /
    # Kokoro inference lives behind the `onnx` feature. Implements the
    # clawft-channels TtsEngine seam without cpal/llm/kernel.
    "crates/clawft-voice-tts",
    # Branchable, checkpointable memory over rvf-runtime::RvfStore — the
    # Rust port of agenticow's COW orchestration (WEFT-616 Phase 1, see
    # .planning/ruv/integration/agenticow-integration-plan.md). Standalone;
    # no hermes-loop or exochain wiring yet (Phases 2-3).
    "crates/clawft-cow-memory",
    # Gaussian splat pipeline (phone video → COLMAP → Brush → SOG).
    # External tools (ffmpeg/colmap/brush) are runtime-only; crates always build.
    # Standalone: `cargo run -p clawft-splatd --release` (binary name: splatd).
    "crates/clawft-splat-pipeline",
    "crates/clawft-splatd",
    # ADR-056 BVH-on-RVF spatial-temporal index (broad-phase; no chain yet).
    "crates/clawft-bvh",
    # WEFT-535: inter-buoy acoustic ranging scaffold (ADR-078 / RANGING.md G1 follow-up).
    "crates/clawft-sonobuoy-ranging",
    # WEFT-229: voice pipeline latency / WER / CPU harness (mock-friendly, no ort).
    "crates/clawft-bench-voice",
    # WEFT-707 / ADR-077 A3: Android edge core (Ed25519 identity + pair store + splatd upload).
    "crates/clawft-android-edge",
]
exclude = [
    "gui/src-tauri",
    # WEFT-313: Tauri 2.0 desktop shell wrapping the clawft-ui dashboard.
    # Excluded from the workspace so kernel developers do not need the
    # platform WebView SDKs (libwebkit2gtk-4.1-dev on Linux, WebView2 on
    # Windows) to build the core crates.
    "clawft-ui/src-tauri",
    # Archived per ADR-051 (clawft-plugin-* fate). These crates are
    # preserved in-tree for git-history continuity and possible future
    # revival, but are not part of the active workspace build.
    "crates/archive",
    # Vector-first leaf display sibling crates. Each has its own
    # `[workspace]` table to keep the embedded toolchain isolation
    # working (Phase A through Phase E — see
    # `docs/design/vector-leaf-display.md`). When a workspace member
    # (clawft-weave) path-deps to one of these, cargo would otherwise
    # complain about "multiple workspace roots in the same workspace"
    # because the inner `[workspace]` declarations are detected during
    # the path-dep walk. Listing them in `exclude` tells cargo
    # explicitly "these directories are not part of THIS workspace,
    # even though a member references them" — the dependent crate is
    # still resolved by the path dep.
    "crates/weftos-leaf-scene",
    "crates/weftos-leaf-renderer",
    "crates/weftos-scene-builder",
    "crates/weftos-leaf-touch-gt911",
    # Pre-Phase-E raster crate. Deprecated; kept out-of-workspace until
    # Phase F's cleanup pass migrates `clawft-edge-pad-idf`.
    "crates/weftos-leaf-display",
    # `clawft-edge-pad` (Inkpad firmware) is out-of-workspace already
    # via its own `[workspace]` table (Xtensa toolchain isolation);
    # listing here is defensive.
    "crates/clawft-edge-pad",
    "crates/clawft-edge-pad-idf",
    "crates/clawft-edge-bench",
    "crates/lgfx-bus-rgb-rs",
    "crates/weftos-leaf-sim",
    # STM32N6 leaf firmware (thumbv8m, own [workspace]) and its host-side
    # RVF validator; built by `scripts/build.sh n6-leaf`.
    "crates/weftos-n6-leaf",
    "crates/weftos-n6-leaf-hostcheck",
    "crates/weftos-n6-node",
    # WEFT-33: cargo-fuzz harness (own [workspace] + nightly/libfuzzer).
    "crates/clawft-core/fuzz",
]

[workspace.package]
version = "0.8.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/weave-logic-ai/weftos"
homepage = "https://github.com/weave-logic-ai/weftos"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP. rustls-tls (not default-tls / native-tls) so the static musl
# release targets build — native-tls pulls openssl-sys, which fails on
# musl ("Could not find openssl"). The service-llm / service-whisper
# crates and tokio-tungstenite already use rustls; this aligns the
# workspace default. webpki-roots ship the CA bundle (no system trust).
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async traits
async-trait = "0.1"

# Async utilities
tokio-util = "0.7"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Path handling
dirs = "6"

# CLI
clap = { version = "4", features = ["derive"] }

# WebSocket
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# Crypto
hmac = "0.12"
sha2 = "0.10"
sha3 = { version = "0.10", default-features = false, features = ["std"] }
# SC-2 / WEFT-223: zeroize raw PCM buffers on drop (voice audio retention).
zeroize = { version = "1.8", features = ["derive"] }

# Scheduling
cron = "0.15"

# Markdown
pulldown-cmark = "0.12"

# Table display
comfy-table = "7"

# Browser open
open = "5"

# YAML
serde_yaml = "0.9"

# Regex
regex = "1"

# Binary discovery
which = "7"

# Random (testing)
# WEFT-553: RUSTSEC-2026-0097 — unsound ThreadRng reseed with custom logger.
# Patched lines: >=0.8.6 / >=0.9.3 / >=0.10.1. Stay on 0.8.x for workspace
# API compatibility (thread_rng); lockfile also carries 0.9.x via hnsw_rs.
rand = "0.8.7"

# WASM-compatible random
getrandom = { version = "0.2", features = ["js"] }

# Ed25519 signing
ed25519-dalek = { version = "2", features = ["rand_core"] }

# WASM runtime (feature-gated behind wasm-sandbox)
# WEFT-551: bumped 33 → 45; now 48.0.4 (MSRV 1.95) for RUSTSEC-2026-0321/0322/
# 0323/0327 (fixed in >=48.0.4,<49 or >=49.0.2; 49.0.2 needs rustc 1.96).
wasmtime = { version = "48.0.4", default-features = false, features = ["cranelift", "async", "wat", "runtime"] }
wasmtime-wasi = { version = "48.0.4", default-features = false, features = ["p1"] }

# File-system watching
# WEFT-553: notify 8+ drops unmaintained `instant` (RUSTSEC-2024-0384) in
# favour of web-time / std Instant. Public API (RecommendedWatcher, EventKind,
# RecursiveMode, Config) is compatible with our call sites.
notify = "8"

# RVF (RuVector Format) -- vector storage
# rvf-types, rvf-runtime, rvf-wire: upstream crates.io (ruvnet)
# weftos-rvf-crypto: our fork with ML-DSA-65 dual signing
rvf-runtime = { version = "0.3", default-features = false, features = ["std"] }
rvf-types = { version = "0.2", default-features = false, features = ["std"] }
weftos-rvf-crypto = { version = "0.3", default-features = false, features = ["std", "ed25519"] }
weftos-rvf-wire = { version = "0.2" }

# CBOR codec (ExoChain payload format)
ciborium = "0.2"

# HNSW approximate nearest neighbor search
instant-distance = "0.6"

# Real BPE tokenizer for context-window budgeting (ADR-058 Phase 2.1).
# Bundles GPT-family vocabs (o200k_base) so token counts are real subword
# counts with no model download — a stand-in for the served model's
# tokenizer until the Hermes tokenizer.json is fetched (then pluggable).
tiktoken-rs = "0.6"

# ONNX Runtime (embedding inference)
ort = { version = "2.0.0-rc.12", default-features = false }
ndarray = "0.16"
# Pure-Rust FFT — mel-fbank front-end for the native ONNX voice models.
rustfft = "6"
# WAV decoding for voice-model tests/fixtures (dev-only).
hound = "3"
# Multi-format audio decode (WEFT-233 audio_transcribe codecs).
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "ogg", "vorbis", "pcm", "mkv"] }
# Qwen3 BPE tokenizer (ADR-059 embedder; pure-Rust fancy-regex, no oniguruma C dep)
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
# fp16 scalar (ADR-059 decoder-ONNX empty past_key_values, dtype-matched to model)
half = "2"

# Noise Protocol (mesh transport encryption)
snow = "0.10"

# QUIC mesh transport (WEFT-118 / ADR-026). Application crypto is Noise
# (snow); quinn still needs TLS for the QUIC handshake, so we use
# self-signed certs + skip-verify on the client. Feature-gated via
# clawft-kernel `quic` (enabled with default `mesh` builds).
quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "rustls",
    "ring",
] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }

# BLAKE3 hashing (ECC cognitive substrate)
blake3 = "1.5"

# Concurrent hash map
dashmap = "6"

# ULID (sortable, ms-prefixed unique ids; used for substrate per-turn
# JSONL keys in clawft-service-agent's substrate sink).
ulid = "1"

# Distributed coordination (crates.io — upstream ruvnet).
# WEFT-552: Cargo.lock pins ruvector-core ≥2.3.0 so the graph uses
# reqwest 0.12 + rustls 0.23 + rustls-webpki ≥0.103.13. Do not re-lock
# ruvector-core to 2.1.x (it pulled reqwest 0.11 → rustls-webpki 0.101).
ruvector-cluster = "2.0"
ruvector-raft = "2.0"
ruvector-replication = "2.0"
ruvector-diskann = "2.1"
# WEFT-46: HybridRouter v2.5 sona-backed skill rerank (feature-gated
# behind clawft-core `hybrid-rerank` so default builds never pull it).
ruvector-sona = "0.2"
cognitum-gate-tilezero = "0.1"
parking_lot = "0.12"
futures = "0.3"

# Internal crates (version + path: version for crates.io, path for workspace).
# Versions MUST track `workspace.package.version` so that bumping the workspace
# version atomically updates all path-dep version constraints (WEFT-8).
clawft-rpc = { version = "0.8.1", path = "crates/clawft-rpc" }
clawft-mesh-local = { version = "0.8.1", path = "crates/clawft-mesh-local" }
clawft-mesh-service = { version = "0.8.1", path = "crates/clawft-mesh-service" }
clawft-types = { version = "0.8.1", path = "crates/clawft-types", default-features = false }
clawft-platform = { version = "0.8.1", path = "crates/clawft-platform", default-features = false }
clawft-core = { version = "0.8.1", path = "crates/clawft-core", default-features = false }
clawft-tools = { version = "0.8.1", path = "crates/clawft-tools", default-features = false }
clawft-channels = { version = "0.8.1", path = "crates/clawft-channels" }
clawft-llm = { version = "0.8.1", path = "crates/clawft-llm", default-features = false }
clawft-services = { version = "0.8.1", path = "crates/clawft-services" }
clawft-plugin = { version = "0.8.1", path = "crates/clawft-plugin", default-features = false }
# WEFT-398: native wasmtime plugin host (not the browser cdylib).
clawft-wasm-host = { version = "0.8.1", path = "crates/clawft-wasm-host" }
# Only the treesitter plugin retains a workspace dependency entry --
# it is the sole orphan-survivor (ADR-051) and is wired into
# `clawft-kernel` via the `treesitter` feature. The other eight
# `clawft-plugin-*` crates live under `crates/archive/` and are not
# referenced by the active workspace build.
clawft-plugin-treesitter = { version = "0.8.1", path = "crates/clawft-plugin-treesitter" }
weftos-worldmodel-core = { version = "0.8.1", path = "crates/weftos-worldmodel-core", default-features = false }
weftos-worldmodel-impls = { version = "0.8.1", path = "crates/weftos-worldmodel-impls", default-features = false }
weftos-worldmodel = { version = "0.8.1", path = "crates/weftos-worldmodel", default-features = false }
weftos-sensor-pipeline-wire = { version = "0.8.1", path = "crates/weftos-sensor-pipeline-wire" }
weftos-sensor-pipeline = { version = "0.8.1", path = "crates/weftos-sensor-pipeline" }
clawft-delegation = { version = "0.8.1", path = "crates/clawft-delegation" }
clawft-graphify = { version = "0.8.1", path = "crates/clawft-graphify", default-features = false }
clawft-security = { version = "0.8.1", path = "crates/clawft-security" }
clawft-kernel = { version = "0.8.1", path = "crates/clawft-kernel", default-features = false }
exo-resource-tree = { version = "0.8.1", path = "crates/exo-resource-tree" }
exo-core = { version = "0.8.1", path = "crates/exo-core" }
exo-dag = { version = "0.8.1", path = "crates/exo-dag" }
weftos = { version = "0.8.1", path = "crates/weftos", default-features = false }
clawft-substrate = { version = "0.8.1", path = "crates/clawft-substrate" }
# ADR-056 / WEFT-718: BVH broad-phase (kernel SpatialBackend behind `ecc`).
clawft-bvh = { version = "0.8.1", path = "crates/clawft-bvh" }
clawft-sonobuoy-ranging = { version = "0.8.1", path = "crates/clawft-sonobuoy-ranging" }
clawft-app = { version = "0.8.1", path = "crates/clawft-app" }
clawft-surface = { version = "0.8.1", path = "crates/clawft-surface" }
clawft-canon = { version = "0.8.1", path = "crates/clawft-canon" }
clawft-service-whisper = { version = "0.8.1", path = "crates/clawft-service-whisper" }
clawft-service-llm = { version = "0.8.1", path = "crates/clawft-service-llm" }
clawft-service-terminal = { version = "0.8.1", path = "crates/clawft-service-terminal" }
clawft-service-classify = { version = "0.8.1", path = "crates/clawft-service-classify" }
clawft-service-agent = { version = "0.8.1", path = "crates/clawft-service-agent" }
clawft-cow-memory = { version = "0.8.1", path = "crates/clawft-cow-memory" }

# EML (exp-ln) function approximation
eml-core = { version = "0.1.0", path = "crates/eml-core" }

# Tree-calculus Form triage
clawft-treecalc = { version = "0.1.0", path = "crates/clawft-treecalc" }

# Graph library
petgraph = "0.7"
rayon = "1.10"
walkdir = "2"

# Testing
insta = { version = "1.39", features = ["json"] }
tempfile = "3"

# cargo-dist configuration
[workspace.metadata.dist]
# The preferred cargo-dist version to use in CI.
# Pin stays on 0.31.0 until the WEFT-462 follow-up regenerates release.yml
# and re-applies the WEFT-593 hand-patch. Upstream latest stable as of
# 2026-07-31 is 0.32.0; v1.0 has not shipped. Plan + cadence:
# docs/plans/weft-462-cargo-dist.md and docs/deployment/release.md
# ("How to bump cargo-dist"). Quarterly sweep — never on a product tag cut.
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# WEFT-593: release.yml is hand-patched (secret-scan-safe job outputs +
# refuse binary-less announce). Without this, `dist plan` / CI host steps
# refuse to run because the workflow differs from stock `dist generate`.
# Re-apply the release.yml patch after any `dist generate` / version bump
# (checklist: docs/plans/weft-462-cargo-dist.md § Phase C). WEFT-462.
allow-dirty = ["ci"]
# Target platforms for binary builds
targets = [
    # Linux glibc
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    # Linux musl (static)
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    # macOS
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    # Windows named-pipe daemon (WEFT-559 / WEFT-11). Re-enabled after
    # client + accept-loop landed. Verify on a Windows host or via
    # cargo-xwin / windows-latest CI before tagging a release that
    # ships the powershell installer artefact.
    "x86_64-pc-windows-msvc",
    #
    # WEFT-476 / HP-16: wasm32-wasip2 is *not* listed here. cargo-dist
    # v0.31–v0.32 known triples include only legacy `wasm32-wasi` and
    # `wasm32-unknown-unknown`, and clawft-wasm is a cdylib (not a dist
    # binary). The WASI artefact is built by the hand-patched
    # `build-wasi` job in release.yml (reusable release-wasi.yml) in
    # parallel with the cargo-dist matrix. When upstream adds wasip2 +
    # WASM library packaging, add the triple here and retire build-wasi.
]
# Installers to generate (Windows powershell installer is a no-op
# without a Windows binary; keep the entry for when WEFT-483 lands).
installers = ["shell", "powershell", "homebrew"]
# Homebrew tap repository
tap = "weave-logic-ai/homebrew-tap"
# Publish jobs to run (homebrew formula auto-published to tap repo)
publish-jobs = ["homebrew"]
# Enable GitHub Attestations for provenance
github-attestations = true
# Create a GitHub Release on tag push
create-release = true
# Archive format per platform (tar.gz for Unix, zip for Windows)
unix-archive = ".tar.gz"
windows-archive = ".zip"
# Include in archives
include = ["LICENSE", "README.md"]
# Do not auto-include workspace crates — we mark distributable ones explicitly
auto-includes = false

# Dev profile drives every `scripts/build.sh test | check | clippy` run, so its
# artifacts dominate target/debug (measured 2026-07-24: 190G, of which deps/
# carried full DWARF for 500+ third-party crates). Dependencies get no
# debuginfo — nobody steps into serde with a debugger — while workspace crates
# keep the cargo default (debug = true) so lldb still works on clawft code.
# Prune the orphaned incremental caches this profile leaves behind with
# `scripts/build.sh clean-stale`.
[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"

# cargo-dist build profile
[profile.dist]
inherits = "release"

[profile.release-wasm]
inherits = "release"
opt-level = "z"
