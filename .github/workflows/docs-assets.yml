# Publish browser WASM + RVF KB to GitHub Releases as CDN-served assets.
# Runs after the browser-wasm build completes on master, or manually.
# The docs site fetches these at runtime via NEXT_PUBLIC_CDN_URL.
#
# WEFT-454: every upload also writes SHA-stamped siblings
# (clawft_wasm-{sha}.wasm / .js, weftos-docs-{sha}.rvf) and prunes older
# stamps so the rolling release retains the last N snapshots for rollback.
# See scripts/release/cdn-snapshot.sh and docs/deployment/cdn.md.

name: Docs Assets Publish

permissions:
  contents: write

on:
  workflow_run:
    workflows: ["Browser WASM"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      skip_wasm:
        description: 'Skip WASM download (use existing cdn-assets)'
        type: boolean
        default: false
      retain:
        description: 'How many SHA snapshot groups to retain on the rolling release'
        type: number
        default: 10

env:
  CARGO_TERM_COLOR: always
  # The "release" that holds latest CDN assets (rolling + SHA snapshots).
  CDN_TAG: cdn-assets
  # Default retain window (overridable via workflow_dispatch input).
  CDN_RETAIN: "10"

jobs:
  publish-assets:
    name: Publish WASM + KB to CDN release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      # Prefer the commit that produced the browser-WASM artifact so the
      # snapshot SHA matches the binary that was built (workflow_run).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # ── Resolve publish SHA ─────────────────────────────────────
      - name: Resolve CDN snapshot SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            FULL="${{ github.event.workflow_run.head_sha }}"
          else
            FULL="${{ github.sha }}"
          fi
          SHORT="${FULL:0:12}"
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "CDN snapshot SHA: $SHORT ($FULL)"

      # ── Download browser WASM artifact ──────────────────────────
      - name: Download browser-wasm-pkg artifact
        if: github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: browser-wasm-pkg
          path: browser-pkg
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download WASM from release (manual trigger)
        if: github.event_name == 'workflow_dispatch' && !inputs.skip_wasm
        run: |
          mkdir -p browser-pkg
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/cdn-assets/clawft_wasm_bg.wasm" -o browser-pkg/clawft_wasm_bg.wasm
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/cdn-assets/clawft_wasm.js" -o browser-pkg/clawft_wasm.js

      - name: Build browser WASM (manual trigger, no existing release)
        if: github.event_name == 'workflow_dispatch' && !inputs.skip_wasm && hashFiles('browser-pkg/clawft_wasm_bg.wasm') == ''
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli
          cargo build --target wasm32-unknown-unknown --profile release-wasm \
            -p clawft-wasm --no-default-features --features browser
          mkdir -p browser-pkg
          wasm-bindgen target/wasm32-unknown-unknown/release-wasm/clawft_wasm.wasm \
            --out-dir browser-pkg --target web --no-typescript

      # ── Build RVF knowledge base ────────────────────────────────
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (build-kb)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/build-kb/target
          key: ${{ runner.os }}-cargo-build-kb-${{ hashFiles('tools/build-kb/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-kb-

      - name: Build knowledge base
        run: |
          cargo build --release --manifest-path tools/build-kb/Cargo.toml
          tools/build-kb/target/release/build-kb \
            --repo-root . \
            --docs-dir docs/src/content/docs \
            --docs-dir docs \
            --output weftos-docs.rvf

      # ── Package assets ──────────────────────────────────────────
      - name: Package WASM bundle
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_wasm) }}
        run: |
          tar -czf browser-wasm-pkg.tar.gz -C browser-pkg .

      # ── Create / update CDN release (rolling + SHA snapshots) ───
      # scripts/release/cdn-snapshot.sh:
      #   1. Uploads rolling filenames (live pointers) with --clobber
      #   2. Uploads clawft_wasm-{sha}.wasm/.js + weftos-docs-{sha}.rvf
      #   3. Writes cdn-manifest.json (current SHA audit trail)
      #   4. Prunes older SHA groups beyond CDN_RETAIN
      - name: Publish CDN assets with SHA snapshots (WEFT-454)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_wasm) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # workflow_dispatch may pass inputs.retain; otherwise job env CDN_RETAIN
          CDN_RETAIN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.retain || '10' }}
        run: |
          scripts/release/cdn-snapshot.sh publish \
            --tag "$CDN_TAG" \
            --sha "${{ steps.sha.outputs.full }}" \
            --wasm-dir browser-pkg \
            --kb weftos-docs.rvf \
            --tarball browser-wasm-pkg.tar.gz \
            --retain "${CDN_RETAIN}"

      - name: Publish KB-only with SHA snapshot (WASM skipped)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_wasm }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CDN_RETAIN: ${{ github.event.inputs.retain || '10' }}
        run: |
          scripts/release/cdn-snapshot.sh publish \
            --tag "$CDN_TAG" \
            --sha "${{ steps.sha.outputs.full }}" \
            --kb weftos-docs.rvf \
            --skip-wasm \
            --retain "${CDN_RETAIN}"

      # ── Summary ─────────────────────────────────────────────────
      - name: Summary
        run: |
          SHORT="${{ steps.sha.outputs.short }}"
          echo "## CDN Assets Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Snapshot SHA: \`$SHORT\` (\`${{ steps.sha.outputs.full }}\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Asset | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|------|" >> "$GITHUB_STEP_SUMMARY"
          if [ -f browser-pkg/clawft_wasm_bg.wasm ]; then
            WASM_SIZE=$(du -h browser-pkg/clawft_wasm_bg.wasm | cut -f1)
            JS_SIZE=$(du -h browser-pkg/clawft_wasm.js | cut -f1)
            echo "| clawft_wasm_bg.wasm (rolling) | $WASM_SIZE |" >> "$GITHUB_STEP_SUMMARY"
            echo "| clawft_wasm.js (rolling) | $JS_SIZE |" >> "$GITHUB_STEP_SUMMARY"
            echo "| clawft_wasm-${SHORT}.wasm | $WASM_SIZE |" >> "$GITHUB_STEP_SUMMARY"
            echo "| clawft_wasm-${SHORT}.js | $JS_SIZE |" >> "$GITHUB_STEP_SUMMARY"
            if [ -f browser-wasm-pkg.tar.gz ]; then
              echo "| browser-wasm-pkg.tar.gz | $(du -h browser-wasm-pkg.tar.gz | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "| WASM | skipped |" >> "$GITHUB_STEP_SUMMARY"
          fi
          KB_SIZE=$(du -h weftos-docs.rvf | cut -f1)
          echo "| weftos-docs.rvf (rolling) | $KB_SIZE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| weftos-docs-${SHORT}.rvf | $KB_SIZE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| cdn-manifest.json | audit trail |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Release: [\`$CDN_TAG\`](../../releases/tag/$CDN_TAG)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Rollback: \`scripts/release/cdn-snapshot.sh rollback --sha $SHORT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Docs: [docs/deployment/cdn.md](../../blob/master/docs/deployment/cdn.md)" >> "$GITHUB_STEP_SUMMARY"
