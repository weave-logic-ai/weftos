#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.
#
# WEFT-593 (hand-patch on top of cargo-dist 0.31.0 output):
# GitHub Actions secret-scans job outputs. The stock plan step put the
# full dist-manifest (including CHANGELOG-derived announcement bodies)
# into `needs.plan.outputs.val`. When any substring matched a registered
# repo/org secret, GHA dropped the output ("Skip output 'val' since it
# may contain secret"), so `fromJson(...).ci.github.artifacts_matrix`
# evaluated empty, `build-local-artifacts` was SKIPPED, and the release
# published with no platform binaries (v0.6.21). We slim free-text fields
# out of job outputs, expose a dedicated matrix output, and refuse to
# host/announce a publishing run unless local+global builds succeeded.
# Re-apply this patch if you regenerate release.yml via `dist generate`.
#
# Card a8dbfb3b (hand-patch): the host job runs scripts/release/sign-release.sh
# before `gh release create`, adding weftos-release.json(.sig). `weaver update`
# refuses a release without them. Re-apply after `dist generate` too.
#
# WEFT-476 (hand-patch): parallel `build-wasi` job calls the reusable
# release-wasi.yml workflow and stages wasm32-wasip2 artefacts under the
# `artifacts-*` name pattern. The host job requires build-wasi success on
# publish and includes those files in `gh release create` — eliminating the
# old 30-minute poll loop in the standalone tag-push WASI workflow.
# cargo-dist v0.31–v0.32 still lacks wasm32-wasip2 in its known target
# list (only legacy wasm32-wasi / wasm32-unknown-unknown); revisit adding
# wasip2 to [workspace.metadata.dist].targets when upstream ships support.

name: Release
permissions:
  "contents": "write"

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  pull_request:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-22.04"
    outputs:
      # Slim manifest (changelog bodies stripped) — safe for GHA secret-scan.
      val: ${{ steps.plan.outputs.manifest }}
      # Dedicated matrix output so builds never depend on the full manifest.
      matrix: ${{ steps.plan.outputs.matrix }}
      pr-run-mode: ${{ steps.plan.outputs.pr_run_mode }}
      is-prerelease: ${{ steps.plan.outputs.is_prerelease }}
      publish-prereleases: ${{ steps.plan.outputs.publish_prereleases }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh"
      - name: Cache dist
        uses: actions/upload-artifact@v6
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          dist ${{ (!github.event.pull_request && format('host --steps=create --tag={0}', github.ref_name)) || 'plan' }} --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"

          # Summarize (do not dump full manifest — CHANGELOG bodies can match
          # registered secrets and get redacted as "***" in the log).
          jq '{
            announcement_tag,
            dist_version,
            apps: [.releases[]?.app_name],
            matrix_include: (.ci.github.artifacts_matrix.include // [] | length),
            pr_run_mode: .ci.github.pr_run_mode
          }' plan-dist-manifest.json

          # WEFT-593: strip free-text announcement fields before job outputs.
          # Full plan remains in the artifacts-plan-dist-manifest artifact.
          jq -c 'del(.announcement_changelog, .announcement_github_body)' \
            plan-dist-manifest.json > plan-slim.json

          {
            echo "manifest<<DIST_MANIFEST_EOF"
            cat plan-slim.json
            echo "DIST_MANIFEST_EOF"
            echo "matrix<<DIST_MATRIX_EOF"
            jq -c '.ci.github.artifacts_matrix // {"include": null}' plan-dist-manifest.json
            echo "DIST_MATRIX_EOF"
            echo "pr_run_mode=$(jq -r '.ci.github.pr_run_mode // "plan"' plan-dist-manifest.json)"
            echo "is_prerelease=$(jq -r '.announcement_is_prerelease // false' plan-dist-manifest.json)"
            echo "publish_prereleases=$(jq -r '.publish_prereleases // false' plan-dist-manifest.json)"
          } >> "$GITHUB_OUTPUT"

          # Fail loud on a tag if cargo-dist itself produced no local targets
          # (distinct from the secret-scan job-output failure mode).
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            count=$(jq '.ci.github.artifacts_matrix.include // [] | length' plan-dist-manifest.json)
            echo "artifacts_matrix.include count=${count}"
            if [ "${count}" -eq 0 ]; then
              echo "::error::cargo-dist produced empty artifacts_matrix.include — refusing binary-less release (WEFT-593)"
              exit 1
            fi
          fi
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    # WEFT-593: read matrix from the dedicated plan output, not the full
    # secret-scan-vulnerable manifest blob.
    if: ${{ fromJson(needs.plan.outputs.matrix).include != null && (needs.plan.outputs.publishing == 'true' || needs.plan.outputs.pr-run-mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    permissions:
      "attestations": "write"
      "contents": "read"
      "id-token": "write"
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - name: Attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "target/distrib/*${{ join(matrix.targets, ', ') }}*"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # WEFT-476: wasm32-wasip2 build in parallel with cargo-dist local targets.
  # cargo-dist does not yet accept wasip2 in [workspace.metadata.dist].targets
  # (known triples include wasm32-wasi / wasm32-unknown-unknown only; clawft-wasm
  # is a cdylib). The reusable workflow stages GHA artifacts named
  # artifacts-wasi-wasm32-wasip2 for the host job's `artifacts-*` download.
  build-wasi:
    name: build-wasi (wasm32-wasip2)
    needs:
      - plan
    if: ${{ needs.plan.outputs.publishing == 'true' || needs.plan.outputs.pr-run-mode == 'upload' }}
    uses: ./.github/workflows/release-wasi.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      publishing: ${{ needs.plan.outputs.publishing == 'true' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets: inherit

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
      - build-wasi
    # WEFT-593: when publishing, require local+global builds to have *succeeded*
    # (not merely skipped). The stock cargo-dist template treated skip as OK,
    # which is how v0.6.21 announced an empty release after the plan output
    # was secret-scrubbed and build-local-artifacts was skipped.
    # WEFT-476: also require build-wasi so the GitHub Release always ships the
    # wasm32-wasip2 artefact without a post-hoc poll/upload race.
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && needs.build-global-artifacts.result == 'success' && needs.build-local-artifacts.result == 'success' && needs.build-wasi.result == 'success' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          set -euo pipefail
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"

          # Persist announcement text as files for the release-create step
          # (avoids stuffing CHANGELOG bodies into step/job outputs — WEFT-593).
          jq -r '.announcement_github_body // ""' dist-manifest.json > announcement-body.txt
          jq -r '.announcement_title // ""' dist-manifest.json > announcement-title.txt
          echo "is_prerelease=$(jq -r '.announcement_is_prerelease // false' dist-manifest.json)" >> "$GITHUB_OUTPUT"

          # Slim job/step output (bodies stripped).
          {
            echo "manifest<<DIST_MANIFEST_EOF"
            jq -c 'del(.announcement_changelog, .announcement_github_body)' dist-manifest.json
            echo "DIST_MANIFEST_EOF"
          } >> "$GITHUB_OUTPUT"

          jq '{
            announcement_tag,
            dist_version,
            apps: [.releases[]?.app_name],
            upload_files: (.upload_files // [] | length)
          }' dist-manifest.json
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v6
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      # Card a8dbfb3b: sign the hash list of every file about to be uploaded
      # (dist-manifest.json included) with the WeaveLogic release key, the
      # COG-008 key `weaver update` pins. No secret, no release: the script
      # fails, and with it this job, before `gh release create` runs.
      - name: Sign release (weftos-release.json + .sig)
        env:
          WEAVELOGIC_RELEASE_KEY: ${{ secrets.WEAVELOGIC_RELEASE_KEY }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: scripts/release/sign-release.sh artifacts "$RELEASE_TAG"
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ steps.host.outputs.is_prerelease == 'true' && '--prerelease' || '' }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          # Title/body come from files written by the host step (WEFT-593) so
          # CHANGELOG text never has to ride through GHA job outputs.
          TITLE=$(cat announcement-title.txt)
          gh release create "${{ needs.plan.outputs.tag }}" \
            --target "$RELEASE_COMMIT" \
            $PRERELEASE_FLAG \
            --title "$TITLE" \
            --notes-file announcement-body.txt \
            artifacts/*

  publish-homebrew-formula:
    needs:
      - plan
      - host
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Slim plan (bodies stripped) still carries .releases[].artifacts for .rb selection.
      PLAN: ${{ needs.plan.outputs.val }}
      GITHUB_USER: "axo bot"
      GITHUB_EMAIL: "admin+bot@axo.dev"
    # WEFT-593: use discrete plan outputs instead of fromJson(full manifest).
    if: ${{ needs.plan.outputs.is-prerelease != 'true' || needs.plan.outputs.publish-prereleases == 'true' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          repository: "weave-logic-ai/homebrew-tap"
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # So we have access to the formula
      - name: Fetch homebrew formulae
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: Formula/
          merge-multiple: true
      # This is extra complex because you can make your Formula name not match your app name
      # so we need to find releases with a *.rb file, and publish with that filename.
      - name: Commit formula files
        run: |
          git config --global user.name "${GITHUB_USER}"
          git config --global user.email "${GITHUB_EMAIL}"

          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith(".rb")] | any)'); do
            filename=$(echo "$release" | jq '.artifacts[] | select(endswith(".rb"))' --raw-output)
            name=$(echo "$filename" | sed "s/\.rb$//")
            version=$(echo "$release" | jq .app_version --raw-output)

            export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
            brew update
            # We avoid reformatting user-provided data such as the app description and homepage.
            brew style --except-cops FormulaAudit/Homepage,FormulaAudit/Desc,FormulaAuditStrict --fix "Formula/${filename}" || true

            git add "Formula/${filename}"
            git commit -m "${name} ${version}"
          done
          git push

  announce:
    needs:
      - plan
      - host
      - publish-homebrew-formula
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' && (needs.publish-homebrew-formula.result == 'skipped' || needs.publish-homebrew-formula.result == 'success') }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
