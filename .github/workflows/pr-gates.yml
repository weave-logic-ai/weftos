name: PR Gates

on:
  pull_request:
    branches: [main, master]
  # WEFT-674: these gates used to be pull_request-ONLY. Because work lands on
  # long-lived feature branches that often have no open PR, the gates never ran
  # against current code. Measured 2026-07-29: the browser-WASM target fails with
  # 15 errors — 10 `future cannot be sent between threads safely` (WEFT-663),
  # 4 cascading E0282, and 1 E0433 `could not find hermes in clawft_llm`
  # (WEFT-672, a newer independent break) — all while a declared "hard gate"
  # existed and was green, because it was never invoked. A gate that only fires
  # at merge protects only the merge moment, which this workflow rarely reaches.
  push:
    branches:
      - master
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'docs/**'
    paths-ignore:
      # Planning notes are not code and cannot break a build. Everything else —
      # including docs/ and *.md — still triggers, because pr-gates.yml has a
      # docs-build job that must run precisely when docs change.
      - '.planning/**'
  # Lets anyone run the full gate on demand from the Actions tab, which is the
  # escape hatch when a branch pattern above doesn't match.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  WASM_TARGET: wasm32-wasip2

concurrency:
  # `github.head_ref` is ONLY set for pull_request events — it is empty on push.
  # Left as-is, every push run would collapse into the single group "pr-" and
  # cancel every other branch's run. Key on the PR number when there is one and
  # the full ref otherwise, so PR runs and per-branch push runs stay isolated.
  group: pr-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------
  # Lint: clippy with warnings-as-errors
  # -------------------------------------------------------------------
  clippy:
    name: Clippy lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

  # -------------------------------------------------------------------
  # Test: workspace suite on Linux + lightweight cross-OS matrix
  # (WEFT-457).
  #
  # Linux remains the primary shipping target and runs the full
  # workspace. macOS + Windows run a scoped package set so platform-
  # specific regressions (named pipes, path/FS, errno shims) fail the
  # PR without tripling CI minutes on a full workspace compile.
  # fail-fast: false so every OS reports its own status.
  # -------------------------------------------------------------------
  test:
    name: Test suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suite: full
          - os: macos-latest
            suite: light
          - os: windows-latest
            suite: light
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ matrix.suite }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-${{ matrix.suite }}-
            ${{ runner.os }}-cargo-test-

      # Test binaries refuse to resolve a real runtime root (the guard in
      # clawft-types); pin one under the runner's temp dir.
      - name: Pin test runtime dir
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/weftos-test-runtime"
          echo "WEFTOS_RUNTIME_DIR=$RUNNER_TEMP/weftos-test-runtime" >> "$GITHUB_ENV"

      # bash is available on windows-latest (Git Bash) and keeps the
      # matrix step identical across OSes.
      - name: Run tests (full workspace)
        if: matrix.suite == 'full'
        shell: bash
        run: cargo test --workspace

      - name: Run tests (cross-OS light)
        if: matrix.suite == 'light'
        shell: bash
        run: |
          # Platform-sensitive foundation crates only (WEFT-457 / build.md):
          #   clawft-rpc      — Windows named-pipe client + UDS (WEFT-11)
          #   clawft-platform — FS/path/env abstractions
          #   clawft-types    — shared types, pure/portable
          #   clawft-cow-memory — macOS __errno_location shim (rvf)
          cargo test \
            -p clawft-rpc \
            -p clawft-platform \
            -p clawft-types \
            -p clawft-cow-memory

  # -------------------------------------------------------------------
  # WASM size gate: assert <300KB raw, <120KB gzipped
  # -------------------------------------------------------------------
  wasm-size:
    name: WASM size gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Ensure WASM target installed
        run: rustup target add wasm32-wasip2

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Install binaryen
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen bc

      - name: Build WASM binary
        run: cargo build --target $WASM_TARGET --profile release-wasm -p clawft-wasm

      - name: WASM size gate
        run: |
          WASM_BINARY="target/wasm32-wasip2/release-wasm/clawft_wasm.wasm"
          chmod +x scripts/bench/wasm-size-gate.sh
          bash scripts/bench/wasm-size-gate.sh "$WASM_BINARY" 300 120

  # -------------------------------------------------------------------
  # Binary size: assert release binary < 10MB
  # -------------------------------------------------------------------
  binary-size:
    name: Binary size check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build release binary
        run: cargo build --release --bin weft

      - name: Check binary size
        run: |
          BINARY="target/release/weft"
          SIZE_BYTES=$(wc -c < "$BINARY")
          SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)
          echo "Binary size: ${SIZE_MB} MB (${SIZE_BYTES} bytes)"

          MAX_SIZE=$((10 * 1048576))  # 10 MB
          if [ "$SIZE_BYTES" -gt "$MAX_SIZE" ]; then
            echo "::error::Binary size ${SIZE_MB} MB exceeds 10 MB limit"
            exit 1
          fi
          echo "Binary size within limit."

      - name: Post size summary
        if: always()
        run: |
          BINARY="target/release/weft"
          if [ -f "$BINARY" ]; then
            SIZE_BYTES=$(wc -c < "$BINARY")
            SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)
            echo "## Binary Size Report" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Size | ${SIZE_MB} MB |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Budget | 10 MB |" >> "$GITHUB_STEP_SUMMARY"
          fi

  # -------------------------------------------------------------------
  # Browser WASM: compilation check for wasm32-unknown-unknown
  #
  # HARD GATE (WEFT-447). The historical "skip on failure" behaviour
  # was retired once BW1 / browser feature flags landed. Any regression
  # that breaks the browser-target build must fail this job. There is
  # no warning fallback — see docs/deployment/release.md "CI gates".
  # -------------------------------------------------------------------
  wasm-browser-check:
    name: Browser WASM check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-browser-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-browser-

      - name: Check browser WASM compilation (hard gate)
        run: cargo check --target wasm32-unknown-unknown -p clawft-wasm --no-default-features --features browser

      - name: Verify native still works
        run: cargo check --workspace

  # -------------------------------------------------------------------
  # WEFT-398: native wasmtime plugin host crate (split from clawft-wasm).
  # Host code must keep compiling/testing independently of the browser
  # cdylib; compat re-export via clawft-wasm --features wasm-plugins.
  # -------------------------------------------------------------------
  wasm-host-check:
    name: WASM host crate (clawft-wasm-host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-host-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-host-

      # Test binaries refuse to resolve a real runtime root (the guard in
      # clawft-types); pin one under the runner's temp dir.
      - name: Pin test runtime dir
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/weftos-test-runtime"
          echo "WEFTOS_RUNTIME_DIR=$RUNNER_TEMP/weftos-test-runtime" >> "$GITHUB_ENV"

      - name: Test clawft-wasm-host
        run: cargo test -p clawft-wasm-host

      - name: Check clawft-wasm wasm-plugins re-export
        run: cargo check -p clawft-wasm --features wasm-plugins

  # -------------------------------------------------------------------
  # Kernel WASM no-mesh: clawft-kernel on wasm32-unknown-unknown with
  # every default feature OFF (including mesh). HARD GATE (WEFT-114).
  #
  # Default features pull mesh (native transports). Without this gate,
  # non-browser code can land in the kernel default feature set and
  # only surface when a browser consumer tries to build. Local twin:
  #   scripts/build.sh check
  #   (or: cargo check -p clawft-kernel --target wasm32-unknown-unknown
  #         --no-default-features)
  # -------------------------------------------------------------------
  wasm-kernel-no-mesh:
    name: Kernel WASM check (no mesh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-kernel-no-mesh-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-kernel-no-mesh-

      # Documented entrypoint: scripts/build.sh check (runs this after
      # workspace check). CI invokes the cargo form directly so the job
      # stays focused and does not re-run the full native workspace check.
      - name: Check clawft-kernel wasm32-unknown-unknown --no-default-features
        run: cargo check -p clawft-kernel --target wasm32-unknown-unknown --no-default-features

  # -------------------------------------------------------------------
  # Browser WASM regression suite (WEFT-388 / M5-A) + duration gate
  # and harness docker smoke (WEFT-408 / P6.7).
  #
  # Runs `crates/clawft-wasm/tests/browser_pipeline.rs` under headless
  # Chrome via wasm-pack. Pins chromedriver to the matching Chrome
  # version that ships on the Ubuntu runner image — `wasm-pack`'s own
  # downloader has shipped mismatched binaries in the past, so we
  # install chromedriver explicitly via Chrome-for-Testing.
  #
  # WEFT-408 / P6.7:
  #   - Captures suite wall-clock as browser-test-duration.json artefact
  #   - Compares against committed baseline (+ optional prior-run artefact)
  #   - Fails when >10% slower (BROWSER_DURATION_SOFT=1 to warn only)
  #   - Docker/nginx smoke of crates/clawft-wasm/www harness pkg
  # -------------------------------------------------------------------
  browser-wasm-tests:
    name: Browser WASM regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-browser-tests-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-browser-tests-

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          fi
          wasm-pack --version

      - name: Install Chrome + matching chromedriver
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Restore prior browser-test-duration artefact (best-effort)
        id: duration-cache
        uses: actions/cache/restore@v4
        with:
          # Saved path must match restore path (see save step below).
          path: prior-browser-test-duration.json
          key: browser-test-duration-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            browser-test-duration-v1-${{ runner.os }}-
          fail-on-cache-miss: false

      - name: Run browser WASM regression suite
        run: scripts/build.sh test-browser

      - name: Upload browser-test-duration artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-duration
          path: browser-test-duration.json
          if-no-files-found: warn
          retention-days: 90

      - name: Browser test-duration gate (≤10% regression)
        if: always() && hashFiles('browser-test-duration.json') != ''
        run: |
          if [ -f prior-browser-test-duration.json ]; then
            echo "Using prior-run artefact for comparison"
            export BROWSER_DURATION_PRIOR=prior-browser-test-duration.json
            cat prior-browser-test-duration.json
          else
            echo "No prior-run cache hit — committed baseline only"
          fi
          scripts/build.sh browser-duration-gate

      - name: Save browser-test-duration for next run comparison
        if: always() && hashFiles('browser-test-duration.json') != ''
        run: cp browser-test-duration.json prior-browser-test-duration.json

      - name: Cache browser-test-duration for next run
        if: always() && hashFiles('prior-browser-test-duration.json') != ''
        uses: actions/cache/save@v4
        with:
          path: prior-browser-test-duration.json
          key: browser-test-duration-v1-${{ runner.os }}-${{ github.run_id }}

      - name: Install wasm-bindgen-cli (for harness pkg smoke)
        if: always()
        run: |
          if ! command -v wasm-bindgen >/dev/null 2>&1; then
            cargo install --locked wasm-bindgen-cli --version 0.2.108
          fi
          wasm-bindgen --version

      - name: Browser harness docker smoke
        if: always()
        run: scripts/build.sh browser-docker-smoke

  # -------------------------------------------------------------------
  # Browser WASM bundle size gate (WEFT-389 / M5-A).
  #
  # Builds the release-wasm bundle, runs `wasm-bindgen` glue, and
  # checks the post-bindgen `_bg.wasm` against a documented budget.
  # Fails on regression. Budget rationale + revision protocol live in
  # `docs/architecture/wasm-bundle-size.md`.
  # -------------------------------------------------------------------
  browser-wasm-bundle-size:
    name: Browser WASM bundle size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-bundle-size-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-bundle-size-

      - name: Install wasm-bindgen-cli
        run: |
          if ! command -v wasm-bindgen >/dev/null 2>&1; then
            cargo install --locked wasm-bindgen-cli
          fi
          wasm-bindgen --version

      - name: Build browser WASM bundle
        run: scripts/build.sh browser

      - name: Run bundle-size gate
        run: scripts/build.sh bundle-size

  # -------------------------------------------------------------------
  # Voice: feature compilation check
  # -------------------------------------------------------------------
  voice-feature-check:
    name: Voice feature check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-voice-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-voice-

      - name: Check voice feature compilation
        run: |
          # This check will start passing once VS1.1 (voice dependencies) is complete.
          if cargo check --features voice -p clawft-plugin 2>/dev/null; then
            echo "Voice feature check passed"
          else
            echo "::warning::Voice feature check skipped (feature not yet implemented)"
          fi

  # -------------------------------------------------------------------
  # Experimental attention (eml-core) feature gate — WEFT-55.
  #
  # `experimental-attention` is OFF by default on eml-core. Default
  # workspace check/test jobs never compile ToyEmlAttention,
  # BaselineAttention, or the attention_* examples, so regressions
  # under the flag would be silent. This job:
  #
  #   1. cargo check -p eml-core --features experimental-attention
  #   2. cargo check the bench examples (attention_gate, attention_compare)
  #   3. cargo test --lib under the feature (unit-level smoke; ~10s)
  #
  # We intentionally do NOT run `cargo run --example attention_gate`
  # here: that go/no-go gate hardcodes ~15k CD trials and is a research
  # criterion, not a PR-latency smoke. Compile + unit tests catch
  # regressions; re-run the full gate locally when changing attention
  # training:
  #   cargo run -p eml-core --example attention_gate --features experimental-attention
  # -------------------------------------------------------------------
  experimental-attention:
    name: Experimental attention feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-exp-attention-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-exp-attention-

      - name: Check eml-core with experimental-attention
        run: cargo check -p eml-core --features experimental-attention

      - name: Check attention_gate example
        run: cargo check -p eml-core --example attention_gate --features experimental-attention

      - name: Check attention_compare example
        run: cargo check -p eml-core --example attention_compare --features experimental-attention

      # Test binaries refuse to resolve a real runtime root (the guard in
      # clawft-types); pin one under the runner's temp dir.
      - name: Pin test runtime dir
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/weftos-test-runtime"
          echo "WEFTOS_RUNTIME_DIR=$RUNNER_TEMP/weftos-test-runtime" >> "$GITHUB_ENV"

      - name: Unit-test attention modules (feature-gated smoke)
        # Filter "attention" matches attention::* and baseline_attention::*.
        run: cargo test -p eml-core --features experimental-attention --lib attention

  # -------------------------------------------------------------------
  # graphify vision-extract feature gate — WEFT-381.
  #
  # `vision-extract` is OFF by default on clawft-graphify. Default
  # workspace check/test jobs never compile vision_extract.rs or the
  # e2e fixture under tests/fixtures/, so regressions under the flag
  # would be silent. This job:
  #
  #   1. cargo check -p clawft-graphify --features vision-extract
  #   2. cargo test  -p clawft-graphify --features vision-extract
  #      (unit tests + tests/vision_extract_e2e.rs with mock vision)
  #
  # Mock vision only — no real Claude / network. Sub-second.
  # -------------------------------------------------------------------
  graphify-vision-extract:
    name: graphify vision-extract feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-vision-extract-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-vision-extract-

      - name: Check clawft-graphify with vision-extract
        run: cargo check -p clawft-graphify --features vision-extract

      # Test binaries refuse to resolve a real runtime root (the guard in
      # clawft-types); pin one under the runner's temp dir.
      - name: Pin test runtime dir
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/weftos-test-runtime"
          echo "WEFTOS_RUNTIME_DIR=$RUNNER_TEMP/weftos-test-runtime" >> "$GITHUB_ENV"

      - name: Test vision_extract path (unit + e2e fixture, mock vision)
        run: cargo test -p clawft-graphify --features vision-extract

  # -------------------------------------------------------------------
  # UI: lint and type-check (when ui/ directory exists)
  # -------------------------------------------------------------------
  ui-check:
    name: UI lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if UI directory exists
        id: check-ui
        run: |
          if [ -d "clawft-ui" ] && [ -f "clawft-ui/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::clawft-ui directory not found, skipping UI checks"
          fi

      - name: Setup Node.js
        if: steps.check-ui.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        if: steps.check-ui.outputs.exists == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        if: steps.check-ui.outputs.exists == 'true'
        run: cd clawft-ui && pnpm install --frozen-lockfile

      - name: Lint
        if: steps.check-ui.outputs.exists == 'true'
        run: cd clawft-ui && pnpm lint

      - name: Type check
        if: steps.check-ui.outputs.exists == 'true'
        run: cd clawft-ui && pnpm type-check

      - name: Test
        if: steps.check-ui.outputs.exists == 'true'
        run: cd clawft-ui && pnpm test --run

  # -------------------------------------------------------------------
  # Cargo Audit: fail on new RustSec advisories.
  # The ignore-list mirrors CARGO_AUDIT_IGNORES in scripts/build.sh and
  # tracks the same WEFT-551/552/553 followups. When those land, drop
  # the matching IDs here too. See:
  #   .planning/reviews/0.7.0-release-gate/audit-findings/cargo-audit-cold-run-2026-04-28.md
  # -------------------------------------------------------------------
  cargo-audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-audit binary
        id: cache-cargo-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-bin-v0.22.1

      - name: Install cargo-audit
        if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-audit --version ^0.22

      - name: Run cargo audit
        run: |
          # Ignores tracked as 0.8.x followups (must stay in sync with
          # CARGO_AUDIT_IGNORES in scripts/build.sh):
          #   WEFT-551 DONE — wasmtime 33 → 45.0.3 (19 IDs cleared)
          #   WEFT-552 DONE — rustls-webpki via ruvector-core 2.3 (3 IDs cleared)
          #   WEFT-553 partial — serial/instant/rustls-pemfile/rand cleared;
          #     residual: paste (2024-0436), bincode (2025-0141)
          cargo audit --deny warnings \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2025-0141

  # -------------------------------------------------------------------
  # npm Audit (WEFT-598): fail on critical/high in product npm lockfiles.
  # Mirrors scripts/build.sh npm-audit. Residual moderates under the
  # ruflo/@claude-flow/cli pin are documented in
  # docs/security/npm-audit-residual.md and do not fail this job.
  # -------------------------------------------------------------------
  npm-audit:
    name: npm audit (critical/high)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm audit (clawft-ui, root, docs/src, gui)
        run: scripts/build.sh npm-audit

  # -------------------------------------------------------------------
  # Agent Directory (AD-1/AD-2): agents/ package standard, catalog, and
  # confidentiality leak check. See
  # docs/research/agent-directory/design.md and its ADR. Local twin:
  # scripts/build.sh gate checks 17-19.
  # -------------------------------------------------------------------
  agents-gate:
    name: Agent directory (validate, catalog, leak check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate agents/ packages (AD-1)
        run: scripts/build.sh agents-validate

      - name: agents/catalog.json is up to date (AD-1)
        run: scripts/build.sh agents-catalog --check

      - name: agents/ confidentiality leak check (AD-2)
        run: scripts/build.sh agents-leak-check

  # -------------------------------------------------------------------
  # Cargo Check: fast workspace-wide compilation check
  # -------------------------------------------------------------------
  check:
    name: Cargo Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      - run: cargo check --workspace

  # -------------------------------------------------------------------
  # Assessment: run weft assess on PR changes
  # -------------------------------------------------------------------
  assess:
    name: Assessment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-assess-${{ hashFiles('**/Cargo.lock') }}

      - name: Build weft CLI
        run: cargo build --release --bin weft

      - name: Initialize assessment
        run: target/release/weft assess init --force

      - name: Run assessment
        run: target/release/weft assess run --scope ci --format github-annotations

  # -------------------------------------------------------------------
  # Docs build (WEFT-448).
  #
  # Compiles the Fumadocs Next.js site so MDX syntax errors block
  # merge. Triggered only when docs/src/** or this workflow change,
  # because a full Next build is slow on cold caches.
  # -------------------------------------------------------------------
  docs-build:
    name: Docs site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect docs changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - 'docs/src/**'
              - '.github/workflows/pr-gates.yml'

      - name: Setup Node.js
        if: steps.filter.outputs.docs == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/src/package-lock.json

      - name: Install docs dependencies
        if: steps.filter.outputs.docs == 'true'
        run: cd docs/src && npm ci

      - name: Build docs site
        if: steps.filter.outputs.docs == 'true'
        run: cd docs/src && npm run build

      - name: Skip notice
        if: steps.filter.outputs.docs != 'true'
        run: echo "No docs/src changes — skipping docs build."

  # -------------------------------------------------------------------
  # Integration smoke test (WEFT-550).
  #
  # Builds the Docker image, starts `weft gateway`, and probes the
  # gateway's HTTP /api/health endpoint via curl with a bounded retry
  # budget. Fails if the container exits within 3 seconds, or if
  # /api/health does not return 200 within ~30 seconds.
  # -------------------------------------------------------------------
  smoke-test:
    name: Integration smoke test
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (amd64 only for CI speed)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: weft:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start gateway container
        run: |
          docker run -d \
            --name weft-smoke \
            -p 8080:8080 \
            weft:smoke-test gateway

      - name: Verify container survives the first 3 seconds
        run: |
          sleep 3
          if ! docker ps --filter "name=weft-smoke" --format "{{.Names}}" | grep -q weft-smoke; then
            echo "::error::Container exited within 3 seconds — startup crash."
            docker logs weft-smoke || true
            exit 1
          fi
          echo "Container is still running after 3s."

      - name: Probe /api/health (bounded retry, 30s budget)
        run: |
          deadline=$(( $(date +%s) + 30 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            code=$(curl -s -o /tmp/health.body -w '%{http_code}' \
                       --max-time 3 http://127.0.0.1:8080/api/health || echo "000")
            if [ "$code" = "200" ]; then
              echo "Gateway /api/health returned 200."
              cat /tmp/health.body
              echo
              exit 0
            fi
            echo "  /api/health returned ${code}, retrying..."
            sleep 2
          done
          echo "::error::Gateway /api/health never returned 200 within 30s."
          docker logs weft-smoke || true
          exit 1

      - name: Shut down container
        if: always()
        run: |
          docker stop weft-smoke 2>/dev/null || true
          docker rm   weft-smoke 2>/dev/null || true

  # -------------------------------------------------------------------
  # VSCode dev-panel build (WEFT-485 / M6-B).
  #
  # Runs only when a PR touches the egui crate or the panel extension —
  # the panel WASM bundle is downstream of clawft-gui-egui, and the
  # extension itself ships the typed proxy that drives the webview. A
  # change in either is allowed to require a full rebuild + tsc pass.
  #
  # Two-step gate:
  #   1. `scripts/build.sh wasm-panel` — wasm-pack/cargo+bindgen+wasm-opt,
  #      then size-budget gate against the documented panel thresholds.
  #   2. `npm install && npm run compile` (tsc -p .) inside the extension.
  #
  # Either failure fails the PR. Skipped (success) on PRs that don't
  # touch either path so unrelated work isn't slowed by Rust+Node bring-up.
  # -------------------------------------------------------------------
  vscode-panel-build:
    name: VSCode panel build (wasm + tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            panel:
              - 'crates/clawft-gui-egui/**'
              - 'extensions/vscode-weft-panel/**'
              - 'scripts/build.sh'
              - 'scripts/bench/check-bundle-size.sh'
              - '.github/workflows/pr-gates.yml'

      - name: Install Rust toolchain
        if: steps.filter.outputs.panel == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        if: steps.filter.outputs.panel == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-vscode-panel-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-vscode-panel-

      - name: Install wasm-bindgen-cli
        if: steps.filter.outputs.panel == 'true'
        run: |
          if ! command -v wasm-bindgen >/dev/null 2>&1; then
            cargo install --locked wasm-bindgen-cli
          fi
          wasm-bindgen --version

      - name: Install binaryen (wasm-opt)
        if: steps.filter.outputs.panel == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
          wasm-opt --version

      - name: Build VSCode panel wasm bundle
        if: steps.filter.outputs.panel == 'true'
        run: scripts/build.sh wasm-panel

      - name: Setup Node.js
        if: steps.filter.outputs.panel == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install extension dependencies
        if: steps.filter.outputs.panel == 'true'
        run: cd extensions/vscode-weft-panel && npm install

      - name: Compile extension (tsc)
        if: steps.filter.outputs.panel == 'true'
        run: cd extensions/vscode-weft-panel && npm run compile

      # WEFT-486 + WEFT-558: headless VSCode end-to-end smoke.
      # Uses @vscode/test-electron under xvfb. Asserts activation,
      # weft.openPanel, and chip-strip DOM (>=1 data-weft-chip with
      # stable data-chip-id="kernel" via the mock a11y inject).
      - name: Install xvfb (headless GUI host)
        if: steps.filter.outputs.panel == 'true'
        run: |
          sudo apt-get install -y xvfb libnss3 libgbm1 libxshmfence1 libgtk-3-0
      - name: Compile test suite (tsc -p test/)
        if: steps.filter.outputs.panel == 'true'
        run: cd extensions/vscode-weft-panel && npm run compile-tests
      - name: Chip a11y unit tests (no VSCode host)
        if: steps.filter.outputs.panel == 'true'
        run: cd extensions/vscode-weft-panel && npm run test:chip-a11y
      - name: Run VSCode E2E smoke (xvfb-run)
        if: steps.filter.outputs.panel == 'true'
        run: cd extensions/vscode-weft-panel && xvfb-run -a npm test

      - name: Skip notice
        if: steps.filter.outputs.panel != 'true'
        run: echo "::notice::No panel-relevant paths touched — skipping wasm + tsc gate."

  # -------------------------------------------------------------------
  # weftos-design audit — ws08 0.8.0 desktop wave
  #
  # Two gates:
  #   1. Theme drift ratchet — `Color32::from_rgb` outside theming.rs
  #      can decrease but never increase past the recorded baseline.
  #   2. Surface contract — every TOML in clawft-app/fixtures and
  #      clawft-surface/fixtures audited against DESIGN.md §3 / §5
  #      (D-NS01 unknown primitive, D-FG01 ui://foreign without
  #      graduation TODO, D-EM01 missing empty/loading/offline states).
  #
  # Skip when the PR doesn't touch the GUI crate, fixtures, the skill,
  # or DESIGN.md / tokens.md — these gates are useless on unrelated PRs.
  # -------------------------------------------------------------------
  weftos-design:
    name: weftos-design audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect relevant changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            design:
              - 'crates/clawft-gui-egui/src/**'
              - 'crates/clawft-app/fixtures/**'
              - 'crates/clawft-surface/fixtures/**'
              - 'docs/DESIGN.md'
              - '.claude/skills/weftos-design/**'
              - '.planning/weftos-design/**'

      - name: Audit theme (color drift ratchet)
        if: steps.filter.outputs.design == 'true'
        run: |
          bash .claude/skills/weftos-design/scripts/audit-theme.sh \
            --baseline .planning/weftos-design/baseline-color-drift.txt

      - name: Audit fixtures (surface contract)
        if: steps.filter.outputs.design == 'true'
        run: |
          fails=0
          for f in crates/clawft-surface/fixtures/*.toml \
                   crates/clawft-app/fixtures/*.toml; do
            [ -f "$f" ] || continue
            if ! bash .claude/skills/weftos-design/scripts/audit-surface.sh "$f"; then
              fails=$((fails+1))
            fi
          done
          # During Phase 3 the existing weftos-admin.toml carries 3
          # known D-EM01 violations tracked under WEFT-589. Allow a
          # fixed allowance until that ticket lands; tighten once the
          # admin app graduates.
          if [ "$fails" -gt 1 ]; then
            echo "::error::weftos-design surface audit: $fails fixture(s) failed (allowance: 1)"
            exit 1
          fi

      - name: Skip notice
        if: steps.filter.outputs.design != 'true'
        run: echo "::notice::No design-relevant paths touched — skipping audit."
