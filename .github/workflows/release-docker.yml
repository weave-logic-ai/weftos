name: Release (Docker)

# Self-contained multi-arch image (WEFT-594).
#
# Strategy: the root Dockerfile is a multi-stage build that compiles `weft`
# from the checkout (static musl, alpine runtime). It does NOT download
# cargo-dist release assets — image tags are not coupled to published
# binaries (see WEFT-593 / empty plan-matrix history).
#
# Multi-arch WITHOUT QEMU: each platform builds on a native runner
# (ubuntu-latest → linux/amd64, ubuntu-24.04-arm → linux/arm64). Digests
# are pushed per-platform, then a multi-arch manifest is assembled with
# `docker buildx imagetools create`. Compiling Rust under QEMU arm64 was
# impractically slow; native runners avoid that entirely.
#
# Still gated on the Release workflow so Docker only publishes when a tag
# release orchestrates successfully — but the image build itself does not
# need those binary artifacts.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  # Gate: only proceed if the Release workflow succeeded (or manual dispatch)
  gate:
    name: Verify release succeeded
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Extract version from tag
        id: version
        env:
          # workflow_run gives us the head_branch (the tag name)
          # workflow_dispatch falls back to GITHUB_REF_NAME
          TAG: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          # The tag is attacker-influenced text; accept only a version string.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+_-]*$'; then
            echo "::error::'${TAG}' is not a release version tag"
            exit 1
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine version from tag '${TAG}'"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building Docker image for v${VERSION}"

  # -------------------------------------------------------------------
  # Per-arch native build (self-contained multi-stage Dockerfile)
  # -------------------------------------------------------------------
  docker:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: [gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "v${{ needs.gate.outputs.version }}"
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tags applied at merge; digests pushed here.
          tags: |
            type=raw,value=${{ needs.gate.outputs.version }}
            type=raw,value=latest

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # No QEMU — runner arch matches matrix.platform.
          push: true
          # Push by digest only; named tags come from the merge job.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.gate.outputs.version }}
          cache-from: type=gha,scope=docker-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.platform }}

      - name: Export digest
        env:
          digest: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # -------------------------------------------------------------------
  # Multi-arch manifest (named tags)
  # -------------------------------------------------------------------
  merge:
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    needs: [gate, docker]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest and push tags
        working-directory: /tmp/digests
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          VERSION="${{ needs.gate.outputs.version }}"
          # Each artifact file is named by the digest hex (no sha256: prefix).
          digests=$(printf "${IMAGE}@sha256:%s " *)
          # shellcheck disable=SC2086
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            $digests

      - name: Inspect manifest
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          VERSION="${{ needs.gate.outputs.version }}"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"

      - name: Summary
        run: |
          echo "## Release Image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | ${{ needs.gate.outputs.version }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Platforms | linux/amd64, linux/arm64 (native runners, no QEMU) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Strategy | Self-contained multi-stage (compile from tag) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Registry | ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Base | Alpine 3.21 (musl, ~30–40 MB) |" >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------
  # Integration smoke test on the published image (amd64 runner)
  # -------------------------------------------------------------------
  smoke-test:
    name: Post-publish smoke test
    runs-on: ubuntu-latest
    needs: [gate, merge]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and test image (WEFT-550 health probe)
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.gate.outputs.version }}"
          docker pull "$IMAGE"

          # Start container
          docker run -d \
            --name weft-release-smoke \
            -p 8080:8080 \
            "$IMAGE" gateway

          cleanup() {
            docker stop weft-release-smoke 2>/dev/null || true
            docker rm   weft-release-smoke 2>/dev/null || true
          }
          trap cleanup EXIT

          # Fail fast if the container crashes during the first 3 seconds.
          sleep 3
          if ! docker ps --filter "name=weft-release-smoke" --format "{{.Names}}" \
                 | grep -q weft-release-smoke; then
            echo "::error::Released image exited within 3 seconds."
            docker logs weft-release-smoke || true
            exit 1
          fi

          # Bounded /api/health probe (30s budget).
          deadline=$(( $(date +%s) + 30 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            code=$(curl -s -o /tmp/health.body -w '%{http_code}' \
                       --max-time 3 http://127.0.0.1:8080/api/health || echo "000")
            if [ "$code" = "200" ]; then
              echo "Released image /api/health returned 200."
              cat /tmp/health.body; echo
              exit 0
            fi
            echo "  /api/health returned ${code}, retrying..."
            sleep 2
          done
          echo "::error::Released image /api/health never returned 200 within 30s."
          docker logs weft-release-smoke || true
          exit 1
