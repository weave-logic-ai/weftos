name: Publish Crates

on:
  # crates.io publish is DEFERRED for the pre-beta line: it no longer
  # auto-runs on a release tag (avoids committing a churning public API
  # surface before the API settles). Trigger it deliberately from the
  # Actions tab ("Run workflow") when ready to publish. To restore
  # auto-publish on tag, re-add under `on:`:
  #   push:
  #     tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/bin/
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-publish-

      - name: Verify tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v${TAG} does not match workspace version ${VERSION}"
            exit 1
          fi
          echo "Publishing version ${VERSION}"

      - name: Publish crates (dependency order, skip existing, wait on 429)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        # New crates are limited to a burst of 5 then 1 per 10 minutes, so a
        # first publish of many new crates takes hours.
        timeout-minutes: 350
        run: scripts/publish-crates.sh
