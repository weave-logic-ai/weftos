# Used by scripts/build.sh through `cargo nextest run --config-file`.
# Each test process runs under scripts/test-runtime-wrap.sh, which gives it a
# private WEFTOS_RUNTIME_DIR under $WEFTOS_TEST_RUNTIME_ROOT (build.sh creates
# and removes that root) and sets WEFTOS_TEST=1 (informational; the test guard reads only the
# executable path, never the environment). The wrapper exits 70 when the
# root is unset, so these tests are never run against a real runtime dir by
# accident.
#
# Wrapper scripts are still an opt-in (experimental) nextest feature.
experimental = ["wrapper-scripts"]

[scripts.wrapper.weftos-test-runtime]
command = { command-line = "scripts/test-runtime-wrap.sh", relative-to = "workspace-root" }

[[profile.default.scripts]]
filter = "all()"
run-wrapper = "weftos-test-runtime"
