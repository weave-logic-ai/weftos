# Well-known capability vocabulary for governed workload placement.
# Source: docs/adr/adr-099-governed-workload-placement.md section 2.
#
# ADVISORY ONLY. This file drives validation warnings, `weaver workload
# explain` output and the generated reference table
# (docs/reference/capability-vocabulary.md). It does NOT gate: a capability id
# that is not listed here is still accepted, stored and matched. Experimental
# ids use the `x.` prefix and draw no warning.
#
# GOVERNED FILE (ADR-099 decision 6). Do not edit freely. A change must bump
# `meta.version` and be approved as a `config.set` on placement/
# capabilities.toml (clawft_kernel::placement_vocabulary::VocabularyGovernor),
# which writes the chain event and issues the new digest pin in
# config/capabilities.pin.toml. A file whose SHA-256 digest differs from the
# pin does not load, and the clawft-types committed-vocabulary tests fail.
# After an approved change, regenerate the doc table with:
# WEFTOS_REGEN_DOCS=1 scripts/build.sh test clawft-types
#
# Schema: [families.<first-segment>] { title, order }
#         [ids."<dotted.id>"] { summary, attrs = { name = type }, min_provenance }
# Attribute types: string, int, number, bool, list. `<name>` segments are
# placeholders matching any one segment. Memory values are bytes.

[meta]
version = 1
title = "WeftOS placement capability vocabulary"

[families.cpu]
title = "CPU"
order = 1

[families.os]
title = "Operating system"
order = 2

[families.runtime]
title = "Runtimes"
order = 3

[families.accel]
title = "Accelerators (GPU, NPU, TPU, TSU, other)"
order = 4

[families.format]
title = "Model and data formats"
order = 5

[families.mem]
title = "Memory"
order = 6

[families.feed]
title = "Feeds"
order = 7

[families.store]
title = "Storage"
order = 8

[families.model]
title = "Models"
order = 9

[families.perf]
title = "Measured performance"
order = 10

[families.trust]
title = "Trust"
order = 11

[families.node]
title = "Node class (informational)"
order = 12

# ---------------------------------------------------------------- cpu / os

[ids."cpu.arch.aarch64"]
summary = "64-bit ARM"
attrs = { cores = "int", model = "string" }

[ids."cpu.arch.armv7"]
summary = "32-bit ARM (armhf)"
attrs = { cores = "int", model = "string" }

[ids."cpu.arch.x86_64"]
summary = "64-bit x86"
attrs = { cores = "int", model = "string" }

[ids."os.linux"]
summary = "Linux"
attrs = { distro = "string", kernel = "string" }

[ids."os.macos"]
summary = "macOS"
attrs = { version = "string" }

# ---------------------------------------------------------------- runtimes

[ids."runtime.native"]
summary = "Unprivileged native process"
attrs = { arches_native = "list", arches_emulated = "list" }

[ids."runtime.container.apple"]
summary = "Apple container runtime"
attrs = { version = "string", arches_native = "list", arches_emulated = "list" }

[ids."runtime.container.docker"]
summary = "Docker-compatible engine (variant: orbstack, engine, desktop)"
attrs = { variant = "string", version = "string", arches_native = "list", arches_emulated = "list" }

[ids."runtime.container.podman"]
summary = "Podman"
attrs = { version = "string", arches_native = "list", arches_emulated = "list" }

[ids."runtime.wasm.wasmtime"]
summary = "Wasmtime WASM host"
attrs = { version = "string" }

[ids."runtime.infer.llamacpp"]
summary = "llama.cpp server"
attrs = { version = "string", formats = "list", arches_native = "list" }

[ids."runtime.infer.mlx-lm"]
summary = "mlx-lm server"
attrs = { version = "string", formats = "list", arches_native = "list" }

[ids."runtime.infer.ollama"]
summary = "Ollama"
attrs = { version = "string", formats = "list", arches_native = "list" }

