# WeftOS local processes. HTTP :18090  MCP SSE :18091
# Do not merge this file into Forge's instance (ADR-098).
version: "0.5"

log_level: info
log_length: 2000

mcp_server:
  host: 127.0.0.1
  port: 18091
  transport: sse
  expose_control_tools: true
  timeout: "15m"

processes:
  weft-kernel:
    description: Shared WeftOS kernel (UDS ~/.clawft/kernel.sock) for every project
    command: weaver kernel start --foreground
    working_dir: /Users/mathewbeane/weftos
    namespace: weftos
    environment:
      - WEFTOS_RUNTIME_DIR=/Users/mathewbeane/.clawft
    availability:
      restart: on_failure
      backoff_seconds: 3
      max_restarts: 3
    readiness_probe:
      exec:
        command: test -S /Users/mathewbeane/.clawft/kernel.sock
      initial_delay_seconds: 2
      period_seconds: 2
      timeout_seconds: 2
      failure_threshold: 20
    success_exit_codes: [143]
    log_location: .grok/compose/logs/weft-kernel.log

  ruflo-daemon:
    description: One Ruflo worker daemon for WeftOS (memory). Not MCP stdio.
    command: npx -y ruflo@latest daemon start --foreground --ttl 0 --quiet --workspace /Users/mathewbeane/weftos
    working_dir: /Users/mathewbeane/weftos
    namespace: ruflo
    availability:
      restart: on_failure
      backoff_seconds: 4
      max_restarts: 3
    success_exit_codes: [143]
    log_location: .grok/compose/logs/ruflo-daemon.log

  weft-docs:
    description: Fumadocs dev (port 4000, not Forge :3000)
    command: npm run dev -- --port 4000
    working_dir: /Users/mathewbeane/weftos/docs/src
    namespace: weftos
    disabled: true
    availability:
      restart: on_failure
      backoff_seconds: 3
      max_restarts: 3
    readiness_probe:
      http_get:
        host: 127.0.0.1
        scheme: http
        path: /
        port: 4000
      initial_delay_seconds: 5
      period_seconds: 3
      timeout_seconds: 3
      failure_threshold: 20
    success_exit_codes: [143]
    log_location: .grok/compose/logs/weft-docs.log

  weft-serve:
    description: scripts/build.sh serve on :8081
    command: scripts/build.sh serve
    working_dir: /Users/mathewbeane/weftos
    namespace: weftos
    disabled: true
    environment:
      - "PORT=8081"
    success_exit_codes: [143]
    log_location: .grok/compose/logs/weft-serve.log

  dashboard-heartbeat:
    description: Report this installation and MetaHarness receipts to the dashboard
    command: node scripts/dashboard-heartbeat.mjs
    namespace: weftos
    availability:
      restart: on_failure
      backoff_seconds: 5
      max_restarts: 3
    success_exit_codes: [143]
    log_location: .grok/compose/logs/dashboard-heartbeat.log

  job_score:
    description: MetaHarness score + genome
    command: scripts/metaharness/score.sh
    working_dir: /Users/mathewbeane/weftos
    disabled: true
    namespace: jobs
    mcp:
      type: tool
    log_location: .grok/compose/logs/job-score.log

  job_board_ready:
    description: List WeftOS dashboard board ready tickets
    command: node scripts/dashboard-board.mjs ready
    working_dir: /Users/mathewbeane/weftos
    disabled: true
    namespace: jobs
    mcp:
      type: tool
    log_location: .grok/compose/logs/job-board-ready.log

  job_crosscut:
    description: Research crosscut
    command: node scripts/metaharness/crosscut.mjs
    working_dir: /Users/mathewbeane/weftos
    disabled: true
    namespace: jobs
    mcp:
      type: tool
    log_location: .grok/compose/logs/job-crosscut.log

  job_fusion:
    description: Fusion ViewSpec + anchors
    command: scripts/metaharness/run-task.sh fusion-view
    working_dir: /Users/mathewbeane/weftos
    disabled: true
    namespace: jobs
    mcp:
      type: tool
    log_location: .grok/compose/logs/job-fusion.log

  job_gate:
    description: scripts/build.sh gate (long)
    command: scripts/build.sh gate
    working_dir: /Users/mathewbeane/weftos
    disabled: true
    namespace: jobs
    mcp:
      type: tool
    log_location: .grok/compose/logs/job-gate.log
